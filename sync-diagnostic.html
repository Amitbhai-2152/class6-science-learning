<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Class 6 • Sync Diagnostic</title><style>body{font-family:system-ui,-apple-system,"Noto Sans Devanagari",sans-serif;background:#f4f7f9;color:#17252b;margin:0;padding:20px}.wrap{max-width:900px;margin:auto}.card{background:#fff;border:1px solid #d9e4e8;border-radius:16px;padding:18px;margin:12px 0;box-shadow:0 8px 24px rgba(0,0,0,.05)}h1{margin-top:0}.ok{color:#087f5b}.bad{color:#c92a2a}.warn{color:#b15c00}.kv{display:grid;grid-template-columns:180px 1fr;gap:8px 14px}.v{word-break:break-all;font-family:ui-monospace,SFMono-Regular,Consolas,monospace}button{padding:11px 15px;border:0;border-radius:10px;background:#0f766e;color:#fff;font-weight:700;cursor:pointer}pre{white-space:pre-wrap;word-break:break-word;background:#f7fafb;padding:12px;border-radius:10px;overflow:auto}.note{color:#52646b;line-height:1.6}</style></head><body><main class="wrap"><section class="card"><h1>🔎 Class 6 Sync Diagnostic</h1><p class="note">यह page केवल diagnosis करता है। यह XP/progress में कोई बदलाव नहीं करता। Chrome और Incognito में इसी page को खोलकर values compare करें।</p><button id="run">Run diagnostic</button></section><section class="card"><div id="status">Diagnostic अभी नहीं चला है।</div></section><section class="card"><h2>Identity &amp; Cloud</h2><div id="cloud" class="kv"></div></section><section class="card"><h2>Local XP</h2><pre id="local">—</pre></section><section class="card"><h2>Loaded sync scripts</h2><pre id="scripts">—</pre></section></main><script src="js/auth-config.js?v=1"></script><script src="js/cloud-sync.js?v=5"></script><script>(async()=>{const $=id=>document.getElementById(id);function esc(v){return String(v??'—').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}function setRows(rows){$('cloud').innerHTML=rows.map(([k,v])=>'<div><b>'+esc(k)+'</b></div><div class="v">'+esc(v)+'</div>').join('')}function local(){let raw=null;try{raw=localStorage.getItem('class6XPSystemV1')}catch(_){}try{return raw?JSON.parse(raw):null}catch(_){return{parseError:true,raw}}}async function run(){const started=Date.now();$('status').textContent='Running…';let user=null,row=null,error='';try{user=await window.Class6CloudSync?.getUser?.();row=user?await window.Class6CloudSync.load():null}catch(e){error=String(e?.message||e)}let owner='';try{owner=localStorage.getItem('class6CloudOwnerV2')||''}catch(_){}const xp=local();const scripts=[...document.scripts].map(s=>s.src).filter(Boolean);const cloudState=row?.state&&typeof row.state==='object'?row.state:{};const cloudSubjects=cloudState.subjects&&typeof cloudState.subjects==='object'?cloudState.subjects:{};const localTotal=Math.max(0,Number(xp?.total)||0);const cloudTotal=Math.max(0,Number(cloudState?.total)||Object.values(cloudSubjects).reduce((a,v)=>a+Math.max(0,Number(v)||0),0));const sameUser=Boolean(user?.id&&owner&&String(user.id)===String(owner));const verdict=error?['ERROR: '+error,'bad']:!user?['Not signed in in this browser','warn']:!row?['Signed-in user has no student_state row','warn']:sameUser&&localTotal===cloudTotal?['Identity and XP currently agree','ok']:['Mismatch detected — compare the fields above in both browsers','bad'];$('status').innerHTML='<b class="'+verdict[1]+'">'+esc(verdict[0])+'</b><br><span class="note">Completed in '+(Date.now()-started)+' ms.</span>';setRows([['Signed-in user ID',user?.id||'—'],['Account email',user?.email||'—'],['Local owner ID',owner||'—'],['Same browser owner/user?',sameUser?'YES':'NO / unavailable'],['Cloud row exists?',row?'YES':'NO'],['Cloud revision',row?.schema_version??'—'],['Cloud updated_at',row?.updated_at??'—'],['Cloud total XP',cloudTotal],['Cloud streak',cloudState?.streakState?.streak??'—'],['Cloud active days',Array.isArray(cloudState?.activeDays)?cloudState.activeDays.length:'—'],['URL',location.href]]);$('local').textContent=xp?JSON.stringify({total:xp.total,subjects:xp.subjects,activeDays:xp.activeDays,events:Array.isArray(xp.events)?xp.events.length:0,version:xp.version},null,2):'No class6XPSystemV1 in localStorage';$('scripts').textContent=scripts.join('\n')||'No scripts';}$('run').addEventListener('click',run);run().catch(e=>{$('status').textContent='Diagnostic failed: '+(e?.message||e)});})();</script></body></html>
