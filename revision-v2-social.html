<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>सामाजिक विज्ञान Revision • Class 6</title><link rel="stylesheet" href="css/style.css"><style>body{margin:0;background:#f4f7fb;color:#20252b;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.wrap{width:min(1100px,calc(100% - 24px));margin:auto;padding:14px 0 56px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.back{display:inline-flex;min-height:44px;align-items:center;padding:10px 15px;border-radius:12px;background:#e8edf3;color:#20252b;text-decoration:none;font-weight:800}.hero{margin-top:14px;padding:24px;border-radius:24px;background:linear-gradient(135deg,#20252b,#59636e);color:#fff}.hero h1{margin:0 0 8px;font-size:clamp(27px,5vw,42px)}.hero p{margin:0;line-height:1.7;color:#edf1f5}.tip{margin:14px 0;padding:12px 14px;background:#fff;border:1px solid #dfe5ec;border-radius:14px;line-height:1.55}.grid{display:grid;gap:12px}.chapter{background:#fff;border:1px solid #dfe5ec;border-radius:18px;overflow:hidden}.chapter summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:17px;min-height:60px}.chapter summary::-webkit-details-marker{display:none}.chapter summary span:first-child{display:grid;gap:4px}.chapter small{color:#667085;font-weight:800}.chapter strong{font-size:18px;line-height:1.35}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:0 12px 12px}.note{display:grid;grid-template-columns:auto 1fr;gap:10px;padding:14px;background:#fbfcfe;border:1px solid #e7ebf0;border-radius:14px}.num{width:28px;height:28px;border-radius:9px;background:#e9eef4;display:grid;place-items:center;font-weight:900;font-size:12px}.note b{display:block;margin-bottom:5px}.note p{margin:0;color:#56606d;font-size:13px;line-height:1.6}@media(max-width:700px){.cards{grid-template-columns:1fr}}</style></head><body><main class="wrap"><div class="top"><strong>🌍 सामाजिक विज्ञान Revision</strong><a class="back" href="revision-v2.html">← Subjects</a></div><section class="hero"><h1>🌍 सामाजिक विज्ञान — Smart Revision</h1><p>14 chapters • हर chapter में 8 Hindi study cards: concept, facts, example, common confusion और exam recap.</p></section><div class="tip">💡 chapter खोलो → 8 cards पढ़ो → नक्शा/उदाहरण से concept जोड़ो → फिर अगला chapter।</div><section id="grid" class="grid"></section></main><script>const D=[['पृथ्वी पर स्थानों का पता लगाना','मानचित्र, ग्लोब, दिशाएँ, पैमाना और प्रतीक पृथ्वी पर स्थानों को समझने के मूल साधन हैं। अक्षांश और देशांतर स्थान निर्धारण को अधिक सटीक बनाते हैं।'],['महासागर और महाद्वीप','पृथ्वी की भूमि को प्रमुख महाद्वीपों और जल को महासागरों में समझा जाता है। इनके आकार और स्थिति जलवायु तथा मानव जीवन को प्रभावित करते हैं।'],['स्थलरूप और जीवन','पहाड़, पठार, मैदान, मरुस्थल और तटीय क्षेत्र अलग-अलग संसाधन और जीवन-शैली प्रदान करते हैं। लोग स्थानीय पर्यावरण के अनुसार अनुकूलन करते हैं।'],['इतिहास की समयरेखा और स्रोत','इतिहास को समझने में घटनाओं का कालक्रम और स्रोत—जैसे अभिलेख, सिक्के, स्मारक और ग्रंथ—महत्वपूर्ण हैं।'],['भारत, अर्थात् भारत','भारत विविध भौगोलिक क्षेत्रों और समुदायों वाला देश है। भारत की पहचान उसके भूगोल, इतिहास और अनेक सांस्कृतिक परंपराओं के मेल से बनती है।'],['भारतीय सभ्यता की शुरुआत','प्राचीन सभ्यताओं में कृषि, नगर, शिल्प, व्यापार और सामाजिक संगठन के विकास ने आगे के भारतीय इतिहास की नींव रखी।'],['भारत की सांस्कृतिक जड़ें','भारतीय संस्कृति कई परंपराओं, भाषाओं, कलाओं और विचारधाराओं के निरंतर मेल से विकसित हुई है। विरासत में भौतिक और अमूर्त दोनों तत्व आते हैं।'],['विविधता में एकता — अनेक में एक','भारत में भाषा, भोजन, पोशाक, परंपरा और भूगोल की विविधता है, फिर भी साझा नागरिक पहचान और आपसी जुड़ाव एकता को मजबूत करते हैं।'],['परिवार और समुदाय','परिवार और समुदाय व्यक्ति को सहयोग, जिम्मेदारी, पहचान और सीखने का वातावरण देते हैं। अलग-अलग परिवारों के रूप अलग हो सकते हैं।'],['जमीनी लोकतंत्र — भाग 1: शासन','लोकतांत्रिक शासन में निर्णय लेने की संस्थाएँ और नागरिकों की भागीदारी महत्वपूर्ण हैं। स्थानीय स्तर पर लोगों की जरूरतें सीधे समझी जा सकती हैं।'],['जमीनी लोकतंत्र — भाग 2: ग्रामीण स्थानीय सरकार','गाँव में ग्राम सभा और पंचायत स्थानीय विकास, सार्वजनिक सुविधाओं और सामुदायिक मुद्दों से जुड़े निर्णयों में भूमिका निभाते हैं।'],['जमीनी लोकतंत्र — भाग 3: शहरी स्थानीय सरकार','नगरपालिकाएँ और नगर निकाय शहरों में स्वच्छता, पानी, सड़क, प्रकाश और अन्य स्थानीय सेवाओं का प्रबंधन करते हैं।'],['आजीविका और आर्थिक जीवन','लोग खेती, व्यापार, सेवा, शिल्प और अन्य कामों से आजीविका कमाते हैं। स्थानीय संसाधन और कौशल काम के अवसरों को प्रभावित करते हैं।'],['विविधता, संसाधन और हमारा भविष्य','प्राकृतिक संसाधन सीमित हो सकते हैं। जिम्मेदार उपयोग, संरक्षण, पुनः उपयोग और सामुदायिक सहयोग भविष्य की पीढ़ियों के लिए संसाधनों को सुरक्षित रखते हैं।']];const L=['मुख्य विचार','जरूरी तथ्य','कैसे समझें','सरल उदाहरण','आम भ्रम','परीक्षा में','याद रखने की तरकीब','एक लाइन में recap'];const mk=(t,c)=>{const x=[c,`जरूरी तथ्य: ${t} के मुख्य शब्द, स्थान, संस्था या कारण-परिणाम संबंधों को एक साथ याद करें।`,`समझने का तरीका: पहले यह पहचानें कि ${t} में “कहाँ/कब/कौन/क्यों/कैसे” में से कौन-सा संबंध मुख्य है।`,`सरल उदाहरण: ${t} से जुड़ी school या आसपास की कोई स्थिति सोचें और concept को उस उदाहरण पर लागू करें।`,`आम भ्रम: केवल एक fact याद कर लेने से पूरा chapter नहीं समझ आता; map, timeline, institution या कारण का संबंध भी देखें।`,`परीक्षा में: परिभाषा या मुख्य तथ्य के बाद उदाहरण, कारण या प्रभाव जोड़ें ताकि उत्तर पूरा बने।`,`याद रखने की तरकीब: ${t} = मुख्य शब्द + स्थान/समय + उदाहरण।`,`Recap: ${t} को तथ्य, संबंध और उदाहरण के साथ दोहराने पर revision मजबूत होता है।`];return x.map((v,i)=>`<div class="note"><span class="num">${i+1}</span><div><b>${L[i]}</b><p>${v}</p></div></div>`).join('')};document.getElementById('grid').innerHTML=D.map((d,i)=>`<details class="chapter"><summary><span><small>Chapter ${i+1}</small><strong>${d[0]}</strong></span><span>＋</span></summary><div class="cards">${mk(d[0],d[1])}</div></details>`).join('')</script></body></html>
