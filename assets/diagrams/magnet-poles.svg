<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450"><defs><style>text{font-family:Arial,"Noto Sans Devanagari",sans-serif;fill:#14243a}.t{font-size:26px;font-weight:700}.s{font-size:20px}.bar{stroke:#1d4ed8;stroke-width:42;stroke-linecap:round}.n{fill:#fee2e2;stroke:#dc2626;stroke-width:3}.p{fill:#dbeafe;stroke:#2563eb;stroke-width:3}</style></defs><rect width="900" height="450" rx="30" fill="#f7faff"/><text x="285" y="55" class="t">चुंबकीय ध्रुवों का व्यवहार</text><g transform="translate(105,110)"><rect x="0" y="0" width="260" height="100" rx="20" fill="#fff" stroke="#cbd5e1"/><circle cx="58" cy="50" r="32" class="n"/><text x="51" y="58" class="s">N</text><circle cx="202" cy="50" r="32" class="p"/><text x="195" y="58" class="s">S</text><text x="65" y="135" class="s">N + S → आकर्षण</text></g><g transform="translate(535,110)"><rect x="0" y="0" width="260" height="100" rx="20" fill="#fff" stroke="#cbd5e1"/><circle cx="58" cy="50" r="32" class="n"/><text x="51" y="58" class="s">N</text><circle cx="202" cy="50" r="32" class="n"/><text x="195" y="58" class="s">N</text><text x="65" y="135" class="s">N + N → विकर्षण</text></g><g transform="translate(310,295)"><rect x="0" y="0" width="280" height="90" rx="20" fill="#fff" stroke="#cbd5e1"/><circle cx="60" cy="45" r="30" class="p"/><text x="53" y="53" class="s">S</text><circle cx="220" cy="45" r="30" class="p"/><text x="213" y="53" class="s">S</text><text x="50" y="120" class="s">S + S → विकर्षण</text></g></svg>