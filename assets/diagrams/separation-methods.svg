<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520"><defs><style>text{font-family:Arial,"Noto Sans Devanagari",sans-serif;fill:#14243a}.t{font-size:25px;font-weight:700}.s{font-size:18px}.b{fill:#fff;stroke:#bfdbfe;stroke-width:3}.a{fill:none;stroke:#2563eb;stroke-width:5;marker-end:url(#m)}</style><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#2563eb"/></marker></defs><rect width="1000" height="520" rx="30" fill="#f6faff"/><text x="340" y="52" class="t">मिश्रण → गुण पहचानो → विधि चुनो</text><rect x="55" y="100" width="260" height="145" class="b" rx="20"/><text x="130" y="140" class="t">🍚 + 🪨</text><text x="105" y="185" class="s">दिखने वाला बड़ा कण</text><text x="115" y="215" class="s">→ हाथ से छंटाई</text><rect x="370" y="100" width="260" height="145" class="b" rx="20"/><text x="450" y="140" class="t">🌾 + 💨</text><text x="430" y="185" class="s">हल्का + भारी</text><text x="435" y="215" class="s">→ फटकना</text><rect x="685" y="100" width="260" height="145" class="b" rx="20"/><text x="770" y="140" class="t">🌾 + 🕳️</text><text x="740" y="185" class="s">कणों का आकार अलग</text><text x="775" y="215" class="s">→ छनाई</text><rect x="210" y="315" width="260" height="145" class="b" rx="20"/><text x="290" y="355" class="t">💧 + 🪨</text><text x="250" y="400" class="s">अघुलनशील भारी कण</text><text x="270" y="430" class="s">→ तलछट/निथारना</text><rect x="530" y="315" width="260" height="145" class="b" rx="20"/><text x="600" y="355" class="t">🧂 + 💧</text><text x="565" y="400" class="s">घुला हुआ ठोस</text><text x="600" y="430" class="s">→ वाष्पीकरण</text><path d="M500 60 V90" class="a"/></svg>