<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460"><defs><style>text{font-family:Arial,"Noto Sans Devanagari",sans-serif;fill:#14243a}.t{font-size:25px;font-weight:700}.s{font-size:18px}.b{fill:#fff;stroke:#bfdbfe;stroke-width:3}</style></defs><rect width="1000" height="460" rx="30" fill="#f6faff"/><text x="345" y="48" class="t">सामग्री के गुण</text><rect x="55" y="95" width="205" height="135" rx="20" class="b"/><text x="105" y="145" class="t">👓</text><text x="80" y="185" class="s">पारदर्शिता</text><text x="72" y="212" class="s">प्रकाश कितना पार?</text><rect x="290" y="95" width="205" height="135" rx="20" class="b"/><text x="365" y="145" class="t">💧</text><text x="350" y="185" class="s">घुलनशीलता</text><text x="315" y="212" class="s">पानी में घुले?</text><rect x="525" y="95" width="205" height="135" rx="20" class="b"/><text x="600" y="145" class="t">🪨</text><text x="575" y="185" class="s">कठोरता</text><text x="555" y="212" class="s">कितना आसानी से खरोंच?</text><rect x="760" y="95" width="185" height="135" rx="20" class="b"/><text x="830" y="145" class="t">✨</text><text x="805" y="185" class="s">चमक</text><text x="782" y="212" class="s">सतह कैसी?</text><path d="M500 265 V310" stroke="#2563eb" stroke-width="5"/><rect x="200" y="315" width="600" height="90" rx="20" class="b"/><text x="260" y="355" class="t">काम की जरूरत → गुणों की तुलना → सही सामग्री</text><text x="350" y="385" class="s">Use properties, not guesses.</text></svg>