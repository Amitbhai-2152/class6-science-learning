<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500"><defs><style>text{font-family:Arial,"Noto Sans Devanagari",sans-serif;fill:#14243a}.t{font-size:24px;font-weight:700}.s{font-size:18px}.o{fill:none;stroke:#2563eb;stroke-width:4;stroke-dasharray:8 8}.sun{fill:#fde68a;stroke:#f59e0b;stroke-width:4}.earth{fill:#60a5fa;stroke:#1d4ed8;stroke-width:4}.moon{fill:#cbd5e1;stroke:#64748b;stroke-width:3}</style></defs><rect width="900" height="500" rx="30" fill="#f7f9ff"/><circle cx="180" cy="250" r="85" class="sun"/><text x="145" y="255" class="t">सूर्य</text><ellipse cx="470" cy="250" rx="235" ry="125" class="o"/><circle cx="470" cy="250" r="48" class="earth"/><text x="430" y="255" class="s">पृथ्वी</text><circle cx="570" cy="185" r="22" class="moon"/><text x="590" y="180" class="s">चंद्रमा</text><path d="M270 250 H410" stroke="#2563eb" stroke-width="5" marker-end="url(#arrow)"/><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#2563eb"/></marker></defs><text x="300" y="220" class="s">प्रकाश</text><text x="330" y="390" class="t">ग्रह • प्राकृतिक उपग्रह • तारा</text><text x="310" y="425" class="s">पृथ्वी सूर्य की परिक्रमा करती है; चंद्रमा पृथ्वी की परिक्रमा करता है।</text></svg>