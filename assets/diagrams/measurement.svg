<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430"><defs><style>text{font-family:Arial,"Noto Sans Devanagari",sans-serif;fill:#14243a}.t{font-size:25px;font-weight:700}.s{font-size:18px}.r{fill:#fff;stroke:#93c5fd;stroke-width:3}.line{stroke:#2563eb;stroke-width:5}</style></defs><rect width="1000" height="430" rx="30" fill="#f5faff"/><text x="330" y="48" class="t">सही ruler reading</text><rect x="100" y="150" width="800" height="80" rx="12" class="r"/><path d="M140 150v35M180 150v25M220 150v35M260 150v25M300 150v35M340 150v25M380 150v35M420 150v25M460 150v35M500 150v25M540 150v35M580 150v25M620 150v35M660 150v25M700 150v35M740 150v25M780 150v35M820 150v25M860 150v35" class="line"/><text x="132" y="260" class="s">0</text><text x="292" y="260" class="s">4</text><text x="452" y="260" class="s">8</text><text x="612" y="260" class="s">12</text><text x="852" y="260" class="s">18 cm</text><path d="M300 125 V290" stroke="#dc2626" stroke-width="4"/><path d="M700 125 V290" stroke="#16a34a" stroke-width="4"/><rect x="300" y="305" width="400" height="36" rx="8" fill="#dcfce7"/><text x="420" y="330" class="s">18 − 4 = 14 cm</text><text x="255" y="105" class="s">शुरुआती reading = 4 cm</text><text x="670" y="105" class="s">अंतिम reading = 18 cm</text></svg>