<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>गणित Revision</title><link rel="stylesheet" href="css/style.css"><style>body{margin:0;background:#f5f7fa;font-family:system-ui;color:#20252b}.wrap{width:min(1050px,calc(100% - 24px));margin:auto;padding:18px 0 50px}.top{display:flex;justify-content:space-between}.a,.open{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:10px 15px;border-radius:12px;text-decoration:none;font-weight:800;background:#e9edf1;color:#20252b}.hero{margin-top:18px;padding:23px;border-radius:22px;background:linear-gradient(135deg,#20252b,#59636e);color:#fff}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:18px}.ch{background:#fff;border:1px solid #e0e5eb;border-radius:17px;padding:17px}.ch p{color:#667085;line-height:1.6}.open{background:#20252b;color:#fff;margin-top:6px}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><div class="top"><strong>➗ गणित Revision</strong><a class="a" href="revision-v2.html">← Subjects</a></div><section class="hero"><h1>गणित — Chapter Revision</h1><p>Chapter-wise quick revision.</p></section><section class="grid"> <script>const c=['बड़ी संख्याएँ','अंकगणितीय व्यंजक','दशमलव','चर वाले व्यंजक','समानांतर और प्रतिच्छेदी रेखाएँ','संख्या पैटर्न','तीन प्रतिच्छेदी रेखाएँ','भिन्न'];document.write(c.map((x,i)=>`<article class="ch"><h2>Chapter ${i+1} · ${x}</h2><p>मुख्य विचार, जरूरी तथ्य और exam recap.</p><a class="open" href="revision-v2.html">Revision खोलें →</a></article>`).join(''))</script></section></main></body></html>
