<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>GK Topic • कक्षा 6</title><style>:root{--bg:#f7f9fc;--card:#fff;--ink:#18202a;--muted:#667085;--line:#e4e8ef;--p:#5b4bdc}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#eef2ff,#fff);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans Devanagari","Segoe UI",sans-serif}.top{background:linear-gradient(120deg,#20252b,#3c4350);color:#fff;padding:22px 16px 28px}.wrap,.main{max-width:1050px;margin:auto}.back{color:#e8edf2;text-decoration:none;font-weight:800}.pill{display:inline-block;margin-top:15px;padding:6px 9px;border-radius:999px;background:#ffffff18;font-size:11px;font-weight:900}.top h1{margin:9px 0 4px;font-size:clamp(28px,6vw,44px)}.top p{margin:0;color:#d5d9df;line-height:1.5}.main{padding:18px 14px 60px}.nav{display:flex;gap:7px;overflow:auto;padding-bottom:8px}.nav a{flex:none;text-decoration:none;background:#fff;border:1px solid var(--line);border-radius:999px;padding:8px 11px;color:#5141c7;font-weight:900;font-size:11px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:10px}.lesson h2{margin:4px 0 7px;font-size:20px}.lesson p{margin:0;line-height:1.7}.ex{margin-top:9px;padding:10px;border-left:4px solid #f59e0b;background:#fff8df;border-radius:8px;line-height:1.6}.practice{margin-top:18px}.q{border:1px solid var(--line);border-radius:13px;padding:12px;margin-top:10px}.q b{display:block;line-height:1.55}.opt{display:block;margin-top:7px;padding:9px;border:1px solid var(--line);border-radius:10px}.btn{width:100%;margin-top:12px;padding:12px;border:0;border-radius:11px;background:var(--p);color:#fff;font-weight:900;cursor:pointer}.result{margin-top:12px;padding:12px;border-radius:10px;background:#f1efff;line-height:1.6}.correct{background:#effaf4;border-color:#86cfa4}.wrong{background:#fff1f2;border-color:#e9a0aa}@media(max-width:560px){.main{padding:14px 11px 50px}.card{padding:14px}.lesson h2{font-size:18px}}</style></head><body><header class="top"><div class="wrap"><a class="back" href="index.html">← GK + Reasoning</a><div class="pill" id="pill">TOPIC</div><h1 id="title">GK</h1><p id="summary"></p></div></header><main class="main"><nav class="nav" id="nav"></nav><section id="lessons"></section><section class="card practice"><h2>📝 Topic Practice</h2><div id="questions"></div><button class="btn" id="submit">Check Answers ✓</button><div id="result"></div></section></main><script src="gk-content.js?v=4"></script><script src="gk-content-expansion.js?v=3"></script><script>const topics=GK_TOPICS,id=Math.max(1,Math.min(topics.length,Number(new URLSearchParams(location.search).get('topic'))||1)),t=topics[id-1];const esc=s=>String(s??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[m]));document.getElementById('nav').innerHTML=topics.map(x=>`<a href="topic.html?topic=${x.id}">${x.id}. ${esc(x.title)}</a>`).join('');document.getElementById('pill').textContent=`TOPIC ${id}`;document.getElementById('title').textContent=t.title;document.getElementById('summary').textContent=`${t.lessons.length} lessons • ${t.questions.length} practice questions`;document.getElementById('lessons').innerHTML=t.lessons.map((s,i)=>`<article class="card lesson"><div style="font-size:11px;font-weight:900;color:#5b4bdc">LESSON ${i+1}/${t.lessons.length}</div><h2>${esc(s[0])}</h2><p>${esc(s[1])}</p><div class="ex"><b>🌱 Example:</b> ${esc(s[2])}</div></article>`).join('');document.getElementById('questions').innerHTML=t.questions.map((q,i)=>`<article class="q"><b>Q${i+1}. ${esc(q[0])}</b>${q[1].map((o,j)=>`<label class="opt"><input type="radio" name="q${i}" value="${j}"> ${String.fromCharCode(65+j)}. ${esc(o)}</label>`).join('')}</article>`).join('');document.getElementById('submit').onclick=()=>{let score=0;document.querySelectorAll('.q').forEach((box,i)=>{const picked=box.querySelector('input:checked'),ans=t.questions[i][2];box.querySelectorAll('.opt').forEach((lab,j)=>{lab.classList.remove('correct','wrong');if(j===ans)lab.classList.add('correct');if(picked&&+picked.value===j&&+picked.value!==ans)lab.classList.add('wrong')});if(picked&&+picked.value===ans)score++});const pct=Math.round(score/t.questions.length*100);document.getElementById('result').innerHTML=`<div class="result"><b>${pct>=80?'🏆 Excellent!':pct>=60?'👍 Good work!':'📚 Revise and try again!'}</b><br>Score: <strong>${score}/${t.questions.length}</strong> (${pct}%)</div>`};</script></body></html>
