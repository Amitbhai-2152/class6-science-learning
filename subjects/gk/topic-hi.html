<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#20252b"><title>GK विषय • कक्षा 6</title><style>body{margin:0;background:#f7f9fc;color:#18202a;font-family:system-ui,-apple-system,"Noto Sans Devanagari","Segoe UI",sans-serif}.top{background:linear-gradient(120deg,#20252b,#3c4350);color:#fff;padding:22px 16px 28px}.wrap,.main{max-width:1050px;margin:auto}.back{color:#e8edf2;text-decoration:none;font-weight:800}.top h1{margin:10px 0 4px;font-size:clamp(28px,6vw,44px)}.top p{margin:0;color:#d5d9df}.main{padding:18px 14px 60px}.nav{display:flex;gap:7px;overflow:auto;padding-bottom:8px}.nav a{white-space:nowrap;text-decoration:none;background:#fff;border:1px solid #e4e8ef;border-radius:999px;padding:8px 11px;color:#5141c7;font-weight:900;font-size:11px}.card{background:#fff;border:1px solid #e4e8ef;border-radius:18px;padding:16px;margin-top:10px;box-shadow:0 8px 24px rgba(20,30,60,.05)}.lesson h2{margin:4px 0 7px;font-size:20px}.lesson p{margin:0;line-height:1.75}.ex{margin-top:9px;padding:10px;border-left:4px solid #f59e0b;background:#fff8df;border-radius:8px;line-height:1.65}.q{border:1px solid #e4e8ef;border-radius:13px;padding:12px;margin-top:10px}.q b{display:block;line-height:1.55}.opt{display:block;margin-top:7px;padding:9px;border:1px solid #e4e8ef;border-radius:10px}.btn{width:100%;margin-top:12px;padding:12px;border:0;border-radius:11px;background:#5b4bdc;color:#fff;font-weight:900;cursor:pointer}.correct{background:#effaf4;border-color:#86cfa4}.wrong{background:#fff1f2;border-color:#e9a0aa}.result{margin-top:12px;padding:12px;border-radius:10px;background:#f1efff;line-height:1.6}@media(max-width:560px){.main{padding:14px 11px 50px}.card{padding:14px}.lesson h2{font-size:18px}}</style></head><body><header class="top"><div class="wrap"><a class="back" href="index.html">← GK + Reasoning</a><h1 id="title">सामान्य ज्ञान</h1><p id="summary"></p></div></header><main class="main"><nav class="nav" id="nav"></nav><section id="lessons"></section><section class="card"><h2>📝 विषय अभ्यास</h2><p>हर प्रश्न ध्यान से पढ़ें और सही विकल्प चुनें।</p><div id="questions"></div><button class="btn" id="submit">उत्तर जाँचें ✓</button><div id="result"></div></section></main><script src="gk-content.js?v=7"></script><script src="gk-content-expansion.js?v=6"></script><script src="gk-hi-content.js?v=3"></script><script src="gk-hi-lessons.js?v=3"></script><script src="gk-hi-lessons-plus.js?v=3"></script><script src="gk-hi-loader.js?v=3"></script><script>const id=Math.max(1,Math.min(GK_HI_TOPICS.length,Number(new URLSearchParams(location.search).get('topic'))||1)),t=GK_HI_TOPICS[id-1],l=GK_HI_LESSONS[id-1];const esc=s=>String(s??'').replace(/[&<>\\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\"':'&quot;',"'":'&#039;'}[m]));document.title=t.title+' • कक्षा 6';document.getElementById('title').textContent=t.title;document.getElementById('summary').textContent=`${l.lessons.length} पाठ • ${t.questions.length} प्रश्न`;document.getElementById('nav').innerHTML=GK_HI_TOPICS.map(x=>`<a href="topic-hi.html?topic=${x.id}">${x.id}. ${esc(x.title)}</a>`).join('');document.getElementById('lessons').innerHTML=l.lessons.map((s,i)=>`<article class="card lesson"><div style="font-size:11px;font-weight:900;color:#5b4bdc">पाठ ${i+1}/${l.lessons.length}</div><h2>${esc(s[0])}</h2><p>${esc(s[1])}</p><div class="ex"><b>🌱 उदाहरण:</b> ${esc(s[2])}</div></article>`).join('');document.getElementById('questions').innerHTML=t.questions.map((q,i)=>`<article class="q"><b>प्रश्न ${i+1}. ${esc(q[0])}</b>${q[1].map((o,j)=>`<label class="opt"><input type="radio" name="q${i}" value="${j}"> ${String.fromCharCode(65+j)}. ${esc(o)}</label>`).join('')}</article>`).join('');document.getElementById('submit').onclick=()=>{let score=0;t.questions.forEach((q,i)=>{const box=document.querySelectorAll('.q')[i],p=box.querySelector('input:checked');box.querySelectorAll('.opt').forEach((lab,j)=>{lab.classList.remove('correct','wrong');if(j===q[2])lab.classList.add('correct');if(p&&+p.value===j&&+p.value!==q[2])lab.classList.add('wrong')});if(p&&+p.value===q[2])score++});const pct=Math.round(score/t.questions.length*100);document.getElementById('result').innerHTML=`<div class="result"><b>${pct>=80?'🏆 बहुत बढ़िया!':pct>=60?'👍 अच्छा प्रयास!':'📚 फिर से अभ्यास करो।'}</b><br>स्कोर: <strong>${score}/${t.questions.length}</strong> (${pct}%)</div>`};</script></body></html>
