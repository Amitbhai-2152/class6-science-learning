<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>GK + Reasoning Practice • कक्षा 6</title><style>:root{--bg:#f7f9fc;--card:#fff;--ink:#18202a;--muted:#667085;--line:#e4e8ef;--p:#5b4bdc}*{box-sizing:border-box}body{margin:0;background:#f6f8fc;color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans Devanagari","Segoe UI",sans-serif}.top{background:linear-gradient(120deg,#20252b,#3c4350);color:#fff;padding:22px 16px 28px}.wrap,.main{max-width:1050px;margin:auto}.back{color:#e8edf2;text-decoration:none;font-weight:800}.top h1{margin:9px 0 5px}.top p{margin:0;color:#d5d9df}.main{padding:18px 16px 60px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.mode{border:1px solid #d7dcec;background:#fff;border-radius:999px;padding:9px 13px;font-weight:900;cursor:pointer}.mode.active{background:#ece9ff;border-color:#bcb4ff;color:#4d3ec3}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:17px}.meta{color:var(--muted);font-size:13px}.q{margin-top:12px;border:1px solid var(--line);border-radius:15px;padding:14px}.q b{display:block;line-height:1.55}.option{display:block;margin-top:8px;padding:10px;border:1px solid var(--line);border-radius:10px;cursor:pointer}.option.correct{background:#effaf4;border-color:#76c893}.option.wrong{background:#fff1f2;border-color:#ef9aa5}.submit{width:100%;margin-top:14px;border:0;border-radius:12px;padding:13px;background:var(--p);color:#fff;font-weight:900;font-size:15px;cursor:pointer}.result{margin-top:14px;padding:14px;background:#f4f2ff;border:1px solid #ddd8ff;border-radius:14px;line-height:1.6}.explain{display:none;margin-top:8px;color:#596273;font-size:12px;line-height:1.55}.review .explain{display:block}.review .result{display:block}@media(max-width:560px){.main{padding:15px 12px 50px}.card{padding:14px}}</style></head><body><header class="top"><div class="wrap"><a class="back" href="index.html">← GK + Reasoning</a><h1>Practice Lab</h1><p id="subtitle">Choose a mode and start.</p></div></header><main class="main"><div class="toolbar"><button class="mode active" data-mode="knowledge">📚 GK</button><button class="mode" data-mode="reasoning">🧩 Reasoning</button><button class="mode" data-mode="mixed">🎯 Mixed</button></div><section class="card"><div class="meta" id="meta"></div><div id="questions"></div><button class="submit" id="submit">Submit & Review ✓</button><div id="result"></div></section></main><script src="gk-content.js?v=1"></script><script>const esc=s=>String(s??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[m]));const params=new URLSearchParams(location.search);let mode=params.get('mode')||'knowledge';const gk=GK_TOPICS.flatMap(t=>t.questions.map(q=>[q,t.title]));const reasoning=REASONING_QUESTIONS.map(q=>[q,'Reasoning']);const poolFor=m=>m==='reasoning'?reasoning:m==='mixed'?[...gk,...reasoning]:gk;function render(){document.querySelectorAll('.mode').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));let pool=poolFor(mode).slice(0,mode==='mixed'?30:15);document.getElementById('subtitle').textContent=mode==='knowledge'?'General Knowledge Practice':mode==='reasoning'?'Logical Reasoning Practice':'GK + Reasoning Mixed Challenge';document.getElementById('meta').textContent=`${pool.length} questions • instant answer review • no negative marking`;document.getElementById('questions').innerHTML=pool.map((x,i)=>{const q=x[0];return `<article class="q" data-i="${i}"><b>Q${i+1}. ${esc(q[0])}</b>${q[1].map((o,j)=>`<label class="option"><input type="radio" name="q${i}" value="${j}"> ${String.fromCharCode(65+j)}. ${esc(o)}</label>`).join('')}<div class="explain">Correct answer: <strong>${esc(q[1][q[2]])}</strong><br>Tip: ${mode==='reasoning'?'Look for the rule or pattern before choosing.':'Connect this fact with its topic and revise the idea, not only the answer.'}</div></article>`}).join('');document.getElementById('result').innerHTML='';}document.querySelectorAll('.mode').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;render()});document.getElementById('submit').onclick=()=>{let score=0;document.querySelectorAll('.q').forEach((box,i)=>{const pair=poolFor(mode).slice(0,mode==='mixed'?30:15)[i],q=pair[0],picked=box.querySelector('input:checked');box.querySelectorAll('.option').forEach((lab,j)=>{lab.classList.remove('correct','wrong');if(j===q[2])lab.classList.add('correct');if(picked&&j===+picked.value&&j!==q[2])lab.classList.add('wrong')});if(picked&&+picked.value===q[2])score++;box.classList.add('review')});const total=document.querySelectorAll('.q').length,pct=Math.round(score/total*100);document.getElementById('result').innerHTML=`<div class="result"><b>${pct>=80?'🏆 Excellent!':pct>=60?'👍 Good work!':'📚 Revise and try again!'}</b><br>Score: <strong>${score}/${total}</strong> (${pct}%)<br>Green = correct answer • Red = your incorrect answer.<br>Each question now also shows a short review tip.</div>`};render();</script></body></html>
