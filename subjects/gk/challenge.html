<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>GK + Reasoning Challenge • कक्षा 6</title><style>:root{--bg:#f6f8fc;--card:#fff;--ink:#18202a;--muted:#667085;--line:#e1e6ef;--p:#5b4bdc}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#eef2ff,#f8fafc);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans Devanagari","Segoe UI",sans-serif}.top{background:linear-gradient(120deg,#20252b,#3c4350);color:#fff;padding:20px 16px 26px}.wrap,.main{max-width:1000px;margin:auto}.back{color:#e8edf2;text-decoration:none;font-weight:800}.top h1{margin:10px 0 4px;font-size:clamp(28px,6vw,44px)}.top p{margin:0;color:#d5d9df}.main{padding:16px 12px 60px}.bar{position:sticky;top:0;z-index:5;margin-bottom:12px;background:#ffffffee;backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:16px;padding:10px;display:flex;justify-content:space-between;gap:10px}.timer{font-weight:950}.meta{color:var(--muted);font-size:12px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px}.q{border:1px solid var(--line);border-radius:14px;padding:13px;margin-top:10px}.q b{display:block;line-height:1.55}.badge{display:inline-block;margin-bottom:7px;padding:4px 7px;border-radius:999px;background:#f0edff;color:#4c3db8;font-size:10px;font-weight:900}.opt{display:block;margin-top:7px;padding:9px;border:1px solid var(--line);border-radius:10px;cursor:pointer}.opt.correct{background:#effaf4;border-color:#83c79f}.opt.wrong{background:#fff1f2;border-color:#eca0aa}.submit{width:100%;border:0;border-radius:12px;padding:13px;background:var(--p);color:#fff;font-weight:900;margin-top:14px;font-size:15px;cursor:pointer}.result{margin-top:14px;padding:14px;border-radius:14px;background:#f1efff;line-height:1.6}.review{display:block;margin-top:8px;padding:8px 10px;background:#f7f8fb;border-radius:9px;color:#596273;font-size:12px;line-height:1.5}@media(max-width:560px){.bar{align-items:flex-start}.card{padding:13px}}</style></head><body><header class="top"><div class="wrap"><a class="back" href="index.html">← GK + Reasoning</a><h1>🏆 Challenge Test</h1><p>GK + Reasoning • 15 minutes • 20 questions • no negative marking</p></div></header><main class="main"><div class="bar"><span class="meta" id="progress">0/20 answered</span><span class="timer" id="timer">15:00</span></div><section class="card"><div id="questions"></div><button class="submit" id="submit">Submit Challenge ✓</button><div id="result"></div></section></main><script src="gk-content.js?v=3"></script><script src="gk-content-expansion.js?v=2"></script><script>const all=[...GK_TOPICS.flatMap(t=>t.questions.map(q=>({q,title:t.title,type:'GK'}))),...REASONING_QUESTIONS.map(q=>({q,title:'Reasoning',type:'Reasoning'}))];for(let i=all.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[all[i],all[j]]=[all[j],all[i]]}const pool=all.slice(0,20);const esc=s=>String(s??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[m]));const root=document.getElementById('questions');root.innerHTML=pool.map((x,i)=>{const q=x.q;return `<article class="q"><span class="badge">${x.type} • ${esc(x.title)}</span><b>Q${i+1}. ${esc(q[0])}</b>${q[1].map((o,j)=>`<label class="opt"><input type="radio" name="q${i}" value="${j}"> ${String.fromCharCode(65+j)}. ${esc(o)}</label>`).join('')}<div class="review" hidden data-review="${i}"></div></article>`}).join('');let submitted=false,start=Date.now(),limit=15*60*1000;function update(){const answered=[...document.querySelectorAll('input:checked')].length;document.getElementById('progress').textContent=`${answered}/20 answered`;}document.querySelectorAll('input').forEach(i=>i.addEventListener('change',update));function finish(auto=false){if(submitted)return;submitted=true;let score=0;document.querySelectorAll('.q').forEach((box,i)=>{const q=pool[i].q,p=box.querySelector('input:checked');box.querySelectorAll('.opt').forEach((lab,j)=>{lab.classList.remove('correct','wrong');if(j===q[2])lab.classList.add('correct');if(p&&+p.value===j&&+p.value!==q[2])lab.classList.add('wrong')});if(p&&+p.value===q[2])score++;const r=box.querySelector('[data-review]');r.hidden=false;r.innerHTML=`Correct answer: <strong>${esc(q[1][q[2]])}</strong><br>${xTip(q, i)}`});const pct=Math.round(score/20*100);document.getElementById('result').innerHTML=`<div class="result"><b>${auto?'⏰ Time up! ':'🎉 Challenge complete! '}${pct>=80?'Excellent!':pct>=60?'Good work!':'Revise and try again!'}</b><br>Score: <strong>${score}/20</strong> (${pct}%)<br>Every question has been reviewed below.</div>`;document.getElementById('submit').disabled=true;}function xTip(q,i){return pool[i].type==='Reasoning'?'Tip: identify the rule, relation or sequence before selecting.':'Tip: connect the fact with its topic and remember the idea, not only the option.'}function tick(){const left=Math.max(0,limit-(Date.now()-start));const sec=Math.ceil(left/1000);document.getElementById('timer').textContent=`${String(Math.floor(sec/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`;if(left<=0)finish(true);else setTimeout(tick,250)}document.getElementById('submit').onclick=()=>finish(false);tick();</script></body></html>
