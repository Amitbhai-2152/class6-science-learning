<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#164e63"><title>सामाजिक विज्ञान अभ्यास • कक्षा 6</title><style>:root{--bg:#f3fafb;--card:#fff;--ink:#17252b;--muted:#62747b;--line:#d9e8eb;--p:#0f766e;--good:#15803d;--bad:#b91c1c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans Devanagari","Segoe UI",sans-serif}.top{background:linear-gradient(120deg,#164e63,#0f766e);color:#fff;padding:20px 15px 27px}.wrap,.main{max-width:1080px;margin:auto}.back{color:#e5fffb;text-decoration:none;font-weight:900}.top h1{margin:9px 0 4px;font-size:clamp(27px,6vw,44px)}.top p{margin:0;color:#d9f4f0}.main{padding:15px 12px 55px}.card{background:#fff;border:1px solid var(--line);border-radius:17px;padding:15px;box-shadow:0 10px 26px rgba(15,61,72,.07)}.filters{display:flex;gap:7px;overflow:auto;padding:5px 0}.filter{white-space:nowrap;border:1px solid #b9dcd8;background:#fff;color:#0f766e;border-radius:999px;padding:8px 11px;font-weight:900;font-size:11px}.filter.active{background:#0f766e;color:#fff}..question{margin-top:12px;border:1px solid var(--line);border-radius:14px;padding:13px}.qtop{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:11px}.question h2{font-size:17px;line-height:1.55}.option{display:block;padding:10px;margin-top:7px;border:1px solid var(--line);border-radius:10px;line-height:1.45}.option.correct{background:#effaf4;border-color:#86efac}.option.wrong{background:#fff2f2;border-color:#fca5a5}.explanation{display:none;margin-top:9px;padding:10px;background:#f7fbfb;border-radius:10px;line-height:1.6}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.btn{border:0;border-radius:11px;padding:11px 14px;background:var(--p);color:#fff;font-weight:900;cursor:pointer}.btn.secondary{background:#fff;color:#0f766e;border:1px solid #b9dcd8}.result{margin-top:12px;padding:13px;background:#effcf9;border-radius:11px;line-height:1.65}.bar{height:9px;background:#e8eff0;border-radius:99px;overflow:hidden}.fill{height:100%;background:#0f766e;width:0}@media(max-width:560px){.actions .btn{width:100%}}</style></head><body><header class="top"><div class="wrap"><a class="back" href="index.html">← सामाजिक विज्ञान</a><h1>अभ्यास प्रयोगशाला 🎯</h1><p>उत्तर दो → explanation पढ़ो → mastery बढ़ाओ → revision पाओ</p></div></header><main class="main"><section class="card"><b>प्रश्न बैंक: <span id="bankCount">0</span></b><div class="filters" id="filters"></div><p>इस अध्याय की mastery: <b id="mastery">0%</b></p><div class="bar"><div id="fill" class="fill"></div></div></section><section id="questions"></section><div class="actions"><button class="btn" id="check">उत्तर जाँचें ✓</button><button class="btn secondary" id="new">नया set ↻</button><a class="btn secondary" href="progress.html">📊 मेरी प्रगति</a></div><div id="result"></div></main><script src="social-science-practice-bank.js?v=2"></script><script src="social-science-progress.js?v=1"></script><script>const BANK=window.SOCIAL_SCIENCE_PRACTICE_BANK||[],S=window.SocialScienceProgress,params=new URLSearchParams(location.search),requested=params.get('chapter');let mode=requested&&BANK.some(x=>String(x.c)===String(requested))?String(requested):'all',set=[],checked=false;document.getElementById('bankCount').textContent=BANK.length;const filters=document.getElementById('filters');filters.innerHTML='<button class="filter" data-c="all">सभी अध्याय</button>'+[...new Set(BANK.map(x=>x.c))].map(c=>`<button class="filter" data-c="${c}">अध्याय ${c}</button>`).join('');function pool(){return mode==='all'?BANK:BANK.filter(x=>String(x.c)===String(mode))}function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function sync(){filters.querySelectorAll('.filter').forEach(x=>x.classList.toggle('active',x.dataset.c===mode));const c=mode==='all'?null:S.state.chapters[Number(mode)];document.getElementById('mastery').textContent=(c?.mastery||0)+'%';document.getElementById('fill').style.width=(c?.mastery||0)+'%'}filters.onclick=e=>{const b=e.target.closest('.filter');if(!b)return;mode=b.dataset.c;make()};function make(){set=shuffle(pool()).slice(0,Math.min(10,pool().length));checked=false;document.getElementById('result').innerHTML='';document.getElementById('questions').innerHTML=set.map((x,i)=>`<article class="question"><div class="qtop"><span>प्रश्न ${i+1}</span><span>अध्याय ${x.c} • ${x.t}</span></div><h2>${x.q}</h2>${x.o.map((o,j)=>`<label class="option"><input type="radio" name="q${i}" value="${j}">${String.fromCharCode(65+j)}. ${o}</label>`).join('')}<div class="explanation" id="e${i}"><b>💡 समझो:</b> ${x.e}</div></article>`).join('');sync()}document.getElementById('check').onclick=()=>{if(checked||!set.length)return;checked=true;let score=0;set.forEach((x,i)=>{const p=document.querySelector(`input[name=q${i}]:checked`),a=p?+p.value:-1;if(a===x.a)score++;document.querySelectorAll(`input[name=q${i}]`).forEach((inp,j)=>{inp.disabled=true;const l=inp.closest('.option');l.classList.toggle('correct',j===x.a);l.classList.toggle('wrong',p&&j===a&&a!==x.a)});document.getElementById('e'+i).style.display='block'});const pct=Math.round(score/set.length*100);if(mode!=='all')S.practice(Number(mode),score,set.length);else S.xp(10+score*2);document.getElementById('result').innerHTML=`<div class="result"><b>${pct>=80?'🏆 बहुत बढ़िया!':pct>=60?'✅ अच्छा प्रयास!':'📚 फिर से अभ्यास करो।'}</b><br>स्कोर: <b>${score}/${set.length}</b> (${pct}%)<br>XP और mastery अपडेट हो गए। ${mode!=='all'?'अगला revision भी निर्धारित किया गया है।':''}</div>`;sync()};document.getElementById('new').onclick=make;make();</script></body></html>
