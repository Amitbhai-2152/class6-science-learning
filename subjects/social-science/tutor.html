<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#164e63"><title>सामाजिक विज्ञान Tutor • कक्षा 6</title><style>:root{--bg:#f4fbfc;--card:#fff;--ink:#17252b;--muted:#62747b;--line:#d9e8eb;--p:#0f766e;--p2:#164e63}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#dff7f5,transparent 35%),var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans Devanagari","Segoe UI",sans-serif}.wrap{max-width:900px;margin:auto}.top{background:linear-gradient(120deg,var(--p2),var(--p));color:#fff;padding:20px 15px 25px}.top a{color:#e5fffb;text-decoration:none;font-weight:900}.top h1{margin:10px 0 4px}.top p{margin:0;color:#d9f4f0}.main{padding:16px 12px 35px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:15px;box-shadow:0 12px 30px rgba(15,61,72,.08)}.context{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}.chip{background:#e8f8f6;color:#115e59;border-radius:999px;padding:6px 9px;font-size:11px;font-weight:900}.messages{min-height:330px;max-height:55vh;overflow:auto;display:grid;gap:9px;padding:4px}.msg{max-width:86%;padding:10px 12px;border-radius:14px;line-height:1.65;white-space:pre-wrap}.bot{background:#eef8f7;justify-self:start;border:1px solid #d5ece9}.user{background:#164e63;color:#fff;justify-self:end}.quick{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.quick button{border:1px solid #c8e3df;background:#f2fbfa;color:#0f766e;border-radius:999px;padding:8px 10px;font-weight:900;cursor:pointer}.composer{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:12px}.composer textarea{resize:none;border:1px solid #cbdde0;border-radius:13px;padding:11px;font:inherit;min-height:52px;outline:none}.composer textarea:focus{border-color:#0f766e;box-shadow:0 0 0 3px #0f766e1a}.send{border:0;border-radius:13px;padding:0 17px;background:linear-gradient(120deg,var(--p),var(--p2));color:#fff;font-weight:900;cursor:pointer}.status{font-size:11px;color:var(--muted);margin-top:7px}.back{display:inline-block;margin-top:12px;text-decoration:none;color:var(--p);font-weight:900}@media(max-width:560px){.composer{grid-template-columns:1fr}.send{height:45px}.msg{max-width:94%}}</style></head><body><header class="top"><div class="wrap"><a href="index.html">← सामाजिक विज्ञान</a><h1>🤖 सामाजिक विज्ञान Tutor</h1><p>अपने वर्तमान अध्याय को समझो, उदाहरण पूछो और कठिन बात को आसान भाषा में सीखो।</p></div></header><main class="main wrap"><section class="card"><div class="context"><span class="chip" id="chapterChip">अध्याय</span><span class="chip">कक्षा 6</span><span class="chip">पूर्ण हिंदी</span><span class="chip">अध्याय-संदर्भित Tutor</span></div><div id="messages" class="messages"></div><div class="quick"><button data-q="इस अध्याय को बहुत आसान भाषा में समझाओ।">सरल समझाओ</button><button data-q="इस अध्याय के सबसे महत्वपूर्ण बिंदु बताओ।">मुख्य बिंदु</button><button data-q="एक अच्छा उदाहरण देकर समझाओ।">उदाहरण दो</button><button data-q="मुझसे इस अध्याय के 3 अभ्यास प्रश्न पूछो।">3 प्रश्न पूछो</button></div><div class="composer"><textarea id="input" placeholder="अपना सवाल लिखें…" aria-label="Tutor सवाल"></textarea><button class="send" id="send">भेजें</button></div><div id="status" class="status">Tutor तैयार है।</div><a class="back" id="chapterBack" href="chapter.html?chapter=1">📖 अध्याय पर वापस जाएँ</a></section></main><script src="../../js/ai-config.js?v=2"></script><script src="../../js/ai-tutor-client.js?v=2"></script><script src="social-science-content.js?v=10"></script><script src="chapter-01-detail.js?v=6"></script><script src="chapter-02-detail.js?v=6"></script><script>const qs=new URLSearchParams(location.search),id=Math.min(14,Math.max(1,Number(qs.get('chapter'))||1)),data=window.SOCIAL_SCIENCE_CHAPTERS||[],c=data.find(x=>Number(x.id)===id)||{id,title:`अध्याय ${id}`,theme:'सामाजिक विज्ञान',goal:''},d=(window.SOCIAL_SCIENCE_CHAPTER_DETAILS||{})[id],messagesEl=document.getElementById('messages'),input=document.getElementById('input'),statusEl=document.getElementById('status'),send=document.getElementById('send');chapterChip.textContent=`अध्याय ${id} • ${c.title}`;chapterBack.href=`chapter.html?chapter=${id}`;const contextParts=[`अध्याय ${id}: ${c.title}`,`विषय: ${c.theme||'सामाजिक विज्ञान'}`,`उद्देश्य: ${c.goal||''}`];if(d?.intro)contextParts.push(`परिचय: ${d.intro}`);if(d?.sections)contextParts.push(...d.sections.map((s,i)=>`पाठ ${i+1}: ${s.title}. ${s.text} उदाहरण: ${s.example}`));if(c.concepts?.length)contextParts.push(`मुख्य अवधारणाएँ: ${c.concepts.join(' | ')}`);if(c.examples?.length)contextParts.push(`उदाहरण: ${c.examples.join(' | ')}`);const lessonContext=contextParts.join('\n').slice(0,5800);let history=[];function add(text,who){const el=document.createElement('div');el.className='msg '+who;el.textContent=text;messagesEl.appendChild(el);messagesEl.scrollTop=messagesEl.scrollHeight}add(`नमस्ते! मैं अध्याय ${id} — “${c.title}” के संदर्भ में आपकी मदद कर सकता हूँ। आप मुझसे अवधारणा, उदाहरण, मानचित्र, स्रोत या अभ्यास के बारे में पूछ सकते हैं।`,'bot');async function ask(text){const q=String(text||'').trim();if(!q)return;add(q,'user');history.push({role:'user',content:q});input.value='';send.disabled=true;statusEl.textContent='🤔 समझ रहा हूँ…';try{const answer=await AITutorClient.ask({messages:history,subject:'कक्षा 6 सामाजिक विज्ञान',chapter:`अध्याय ${id}: ${c.title}`,section:c.theme||'',lessonContext});history.push({role:'assistant',content:answer});add(answer,'bot');statusEl.textContent='Tutor तैयार है।'}catch(e){history.pop();add('⚠️ Tutor से उत्तर नहीं मिल पाया। कृपया थोड़ी देर बाद फिर कोशिश करें।','bot');statusEl.textContent=String(e.message||'Connection error')}finally{send.disabled=false;input.focus()}}send.onclick=()=>ask(input.value);input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();ask(input.value)}});document.querySelectorAll('.quick button').forEach(b=>b.onclick=()=>ask(b.dataset.q));</script></body></html>
