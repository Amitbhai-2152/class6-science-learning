<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#164e63"><title>मेरी प्रगति • सामाजिक विज्ञान</title><style>:root{--bg:#f4fbfc;--card:#fff;--ink:#17252b;--muted:#62747b;--line:#d9e8eb;--p:#0f766e;--p2:#164e63}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#dff7f5,transparent 35%),var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans Devanagari","Segoe UI",sans-serif}.top{background:linear-gradient(120deg,var(--p2),var(--p));color:#fff;padding:22px 15px 28px}.wrap,.main{max-width:1080px;margin:auto}.back{color:#e5fffb;text-decoration:none;font-weight:900}.top h1{margin:10px 0 4px;font-size:clamp(28px,6vw,44px)}.top p{margin:0;color:#d9f4f0}.main{padding:16px 13px 55px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 10px 28px rgba(15,61,72,.07)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.kpi{padding:15px;background:#effcf9;border-radius:13px;text-align:center}.kpi b{display:block;font-size:25px;color:#0f766e}.kpi span{font-size:11px;color:var(--muted);font-weight:800}.box{margin-top:13px;padding:15px;border:1px solid var(--line);border-radius:14px;line-height:1.7}.box a{display:block;margin:7px 0;padding:9px;background:#effcf9;border-radius:9px;color:#0f766e;text-decoration:none;font-weight:900}.badge{display:inline-block;padding:7px 10px;margin:4px;background:#eaf8f6;border-radius:999px;color:#0f766e;font-weight:900;font-size:12px}@media(max-width:650px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:420px){.grid{grid-template-columns:1fr}.main{padding:12px 10px 45px}}</style></head><body><header class="top"><div class="wrap"><a class="back" href="index.html">← सामाजिक विज्ञान</a><h1>📊 मेरी प्रगति</h1><p>Progress • XP • Mastery • Revision • Badges</p></div></header><main class="main"><section class="card"><div id="summary"></div></section><section class="card" style="margin-top:14px"><div id="details"></div></section><section class="card" style="margin-top:14px"><h2>📚 अध्याय Mastery</h2><div id="chapters"></div></section></main><script src="social-science-progress.js?v=1"></script><script>const S=window.SocialScienceProgress,chapters=['पृथ्वी पर स्थानों का पता लगाना','महासागर और महाद्वीप','स्थलरूप और जीवन','इतिहास की समयरेखा और स्रोत','भारत, अर्थात् भारत','भारतीय सभ्यता की शुरुआत','भारत की सांस्कृतिक जड़ें','विविधता में एकता — अनेक में एक','परिवार और समुदाय','जमीनी लोकतंत्र — भाग 1: शासन','जमीनी लोकतंत्र — भाग 2: ग्रामीण स्थानीय सरकार','जमीनी लोकतंत्र — भाग 3: शहरी स्थानीय सरकार','आजीविका और आर्थिक जीवन','विविधता, संसाधन और हमारा भविष्य'];function draw(){const s=S.summary();summary.innerHTML=`<div class="grid"><div class="kpi"><b>${s.overall}%</b><span>कुल प्रगति</span></div><div class="kpi"><b>${s.mastery}%</b><span>Mastery</span></div><div class="kpi"><b>${s.xp}</b><span>XP</span></div><div class="kpi"><b>${s.streak}</b><span>Learning Streak</span></div></div>`;S.render('details');chaptersEl.innerHTML=chapters.map((t,i)=>{const c=S.state.chapters[i+1]||{progress:0,mastery:0,best:0,attempts:0};return `<div class="box"><b>अध्याय ${i+1}: ${t}</b><br>Progress: <b>${c.progress||0}%</b> • Mastery: <b>${c.mastery||0}%</b> • Best: ${c.best||0}% • Attempts: ${c.attempts||0}<br><a href="chapter.html?chapter=${i+1}">अध्याय खोलें →</a></div>`}).join('')}const chaptersEl=document.getElementById('chapters');draw();window.addEventListener('sst:progress',draw);</script></body></html>
