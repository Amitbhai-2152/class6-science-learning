<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#20252b">
<title>Maths Chapter • कक्षा 6</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--ink:#172033;--muted:#667085;--line:#e7eaf0;--p:#6557e8;--p2:#8b7df2}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#f1efff,transparent 34%),var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans Devanagari","Segoe UI",sans-serif}.top{background:linear-gradient(120deg,#20252b,#343a40);color:#fff;padding:20px 16px 26px}.wrap,.main{max-width:1000px;margin:auto}.back{color:#e9edf2;text-decoration:none;font-weight:800}.pill{display:inline-block;margin-top:18px;padding:7px 10px;border-radius:999px;background:#ffffff14;font-size:11px;font-weight:900}.top h1{margin:8px 0 4px;font-size:clamp(28px,5vw,44px)}.top p{margin:0;color:#cfd5db}.main{padding:22px 16px 70px}.chapter-nav{display:flex;gap:7px;overflow:auto;padding-bottom:4px}.chapter-nav a{flex:none;text-decoration:none;color:#4f46b8;background:#efedff;border:1px solid #ddd8ff;border-radius:999px;padding:8px 11px;font-size:12px;font-weight:900}.card{margin-top:15px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:19px;box-shadow:0 10px 28px rgba(26,34,61,.07)}.kicker{font-size:11px;color:var(--p);font-weight:900}.hero h2{margin:6px 0;font-size:29px}.body{font-size:17px;line-height:1.85;color:#25314a}.callout{margin-top:12px;padding:12px;border-left:4px solid var(--p);background:#f2efff;border-radius:10px;line-height:1.65}.example{margin-top:12px;padding:12px;border-left:4px solid #f59e0b;background:#fff8df;border-radius:10px;line-height:1.65}.challenge{margin-top:15px}.q{border:1px solid var(--line);border-radius:13px;padding:13px;margin:9px 0}.q strong{display:block;margin-bottom:7px}.options button{display:block;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px;margin:6px 0}.tutor-note{display:flex;justify-content:space-between;align-items:center;gap:9px;flex-wrap:wrap}.tutor-btn{border:0;background:#6557e8;color:#fff;padding:10px 12px;border-radius:10px;font-weight:900}.empty{padding:25px;text-align:center;color:var(--muted)}@media(max-width:560px){.main{padding:17px 12px 55px}.card{padding:15px}.body{font-size:16px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<header class="top"><div class="wrap"><a class="back" href="index.html">← Maths Home</a><div class="pill" id="kicker">CHAPTER</div><h1 id="title">Maths</h1><p id="goal">Concept learning</p></div></header>
<main class="main"><nav class="chapter-nav" id="nav"></nav><section class="card hero" id="content"><div class="empty">Chapter load हो रहा है…</div></section><section class="card tutor-note"><div><strong>🤖 Maths Tutor</strong><div style="color:var(--muted);font-size:12px;margin-top:3px">Concept, hint, example या step पूछो।</div></div><button class="tutor-btn" onclick="MathsTutor.open()">Tutor खोलें</button></section></main>
<script src="chapter-01.js"></script><script src="chapter-02.js"></script><script src="chapter-03.js"></script><script src="chapter-04.js"></script><script src="chapter-05.js"></script><script src="chapter-06.js"></script><script src="chapter-07.js"></script><script src="chapter-08.js"></script><script src="maths-tutor.js"></script>
<script>
const chapters=[window.mathsChapter01,window.mathsChapter02,window.mathsChapter03,window.mathsChapter04,window.mathsChapter05,window.mathsChapter06,window.mathsChapter07,window.mathsChapter08].filter(Boolean);
const n=Math.max(1,Math.min(8,Number(new URLSearchParams(location.search).get('chapter'))||1));
const c=chapters[n-1];
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
document.getElementById('nav').innerHTML=chapters.map(x=>`<a href="chapter.html?chapter=${x.id}">अ ${x.id}</a>`).join('');
if(c){document.getElementById('kicker').textContent=`CHAPTER ${c.id}`;document.getElementById('title').textContent=c.title;document.getElementById('goal').textContent=c.goal||'Concept learning';const sections=c.sections||[];document.getElementById('content').innerHTML=`<div class="kicker">अध्याय ${c.id} • ${sections.length} learning sections</div>${sections.map((s,i)=>`<article style="margin-top:22px"><h2>${esc(s.title)}</h2><p class="body">${esc(s.body)}</p>${s.remember?`<div class="callout"><b>💡 याद रखो:</b> ${esc(s.remember)}</div>`:''}${s.example?`<div class="example"><b>🌍 उदाहरण:</b> ${esc(s.example)}</div>`:''}${s.mistake?`<div class="callout" style="border-left-color:#dc2626;background:#fff1f2"><b>⚠️ Common Mistake:</b> ${esc(s.mistake)}</div>`:''}</article>`).join('')}${(c.challenge||[]).length?`<div class="challenge"><h2>🎯 Challenge</h2>${c.challenge.slice(0,6).map((q,i)=>`<div class="q"><strong>Q${i+1}. ${esc(q.question)}</strong><div class="options">${(q.options||[]).map((o,j)=>`<button type="button" onclick="this.parentElement.parentElement.dataset.answer='${j}'">${String.fromCharCode(65+j)}. ${esc(o)}</button>`).join('')}</div><small style="color:var(--muted)">उत्तर chapter challenge में check किया जाएगा।</small></div>`).join('')}</div>`:''}`}else document.getElementById('content').innerHTML='<div class="empty">यह chapter उपलब्ध नहीं है।</div>';
</script>
</body></html>
