<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#2563eb"><title>Daily Vocabulary • English</title><style>:root{--bg:#f7f8fc;--card:#fff;--ink:#172033;--muted:#667085;--line:#e5e8ef;--p:#2563eb;--p2:#06b6d4}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#eef5ff,transparent 35%),var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans Devanagari","Segoe UI",sans-serif}.wrap{max-width:850px;margin:auto;padding:18px 14px 60px}.back{color:#174ea6;font-weight:900;text-decoration:none}.hero,.word{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:0 12px 32px rgba(20,35,70,.08)}.hero{margin-top:12px;padding:22px;background:linear-gradient(135deg,#2563eb,#06b6d4);color:#fff}.hero h1{margin:7px 0}.hero p{margin:0;line-height:1.6}.pill{display:inline-block;padding:6px 9px;border-radius:999px;background:#ffffff20;font-size:11px;font-weight:900}.word{margin-top:16px;padding:22px}.day{font-size:12px;color:var(--p);font-weight:900}.term{font-size:38px;font-weight:950;margin:8px 0 2px}.meaning{font-size:20px;font-weight:800;color:var(--muted)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:15px}.box{padding:12px;border-radius:12px;background:#f8fbff;border:1px solid var(--line);line-height:1.6}.box b{display:block;margin-bottom:4px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.btn{border:0;border-radius:11px;padding:11px 14px;font-weight:900;cursor:pointer;background:#eef5ff;color:#174ea6}.btn.primary{background:var(--p);color:#fff}@media(max-width:560px){.grid{grid-template-columns:1fr}.term{font-size:32px}}</style></head><body><main class="wrap"><a class="back" href="index.html">← English Home</a><section class="hero"><span class="pill">📚 DAILY VOCABULARY</span><h1>आज का Word Power</h1><p>हर दिन एक useful English word सीखो और उसे अपने sentence में इस्तेमाल करो।</p></section><section class="word" id="word"></section><section class="word"><h2>🗂️ Word Bank</h2><div id="bank" class="actions"></div></section></main><script src="daily-vocabulary.js"></script><script>const esc=s=>String(s??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[m]));let idx=Math.floor(Date.now()/86400000)%DAILY_VOCABULARY.length;function render(){const x=DAILY_VOCABULARY[idx];document.getElementById('word').innerHTML=`<div class="day">DAY ${x.day}</div><div class="term">${esc(x.word)}</div><div class="meaning">${esc(x.meaning)} • ${esc(x.type)}</div><div class="grid"><div class="box"><b>🌍 Example</b>${esc(x.example)}</div><div class="box"><b>🔁 Similar</b>${esc(x.synonyms)}</div><div class="box"><b>↔️ Opposite</b>${esc(x.opposite)}</div><div class="box"><b>🧩 Challenge</b>${esc(x.challenge)}</div></div><div class="actions"><button class="btn" onclick="speakWord()">🔊 Hear word</button><button class="btn primary" onclick="nextWord()">Next word →</button></div>`;document.getElementById('bank').innerHTML=DAILY_VOCABULARY.map((v,i)=>`<button class="btn" onclick="idx=${i};render()">${v.day}. ${esc(v.word)}</button>`).join('')}function nextWord(){idx=(idx+1)%DAILY_VOCABULARY.length;render();window.scrollTo({top:0,behavior:'smooth'})}function speakWord(){const x=DAILY_VOCABULARY[idx];if('speechSynthesis'in window){speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(x.word))}}render();</script></body></html>
