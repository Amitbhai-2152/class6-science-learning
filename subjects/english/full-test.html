<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>English Full Test • Class 6</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f8fc;color:#172033;font-family:system-ui,-apple-system,"Noto Sans Devanagari","Segoe UI",sans-serif}.wrap{max-width:920px;margin:auto;padding:18px 12px 60px}.top{background:linear-gradient(135deg,#2563eb,#06b6d4);color:#fff;border-radius:22px;padding:20px}.back{color:#fff;text-decoration:none;font-weight:800}.top h1{margin:10px 0 5px}.top p{margin:0;line-height:1.6}.bar{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin:14px 0}.pill{padding:7px 10px;border-radius:999px;background:#eef5ff;color:#174ea6;font-size:11px;font-weight:900}.q{background:#fff;border:1px solid #e4e8ef;border-radius:16px;padding:15px;margin:11px 0}.q h3{font-size:17px;line-height:1.55;margin:0 0 10px}.opt{display:block;padding:10px;border:1px solid #e4e8ef;border-radius:10px;margin:7px 0}.opt input{margin-right:7px}.submit,.secondary{width:100%;border:0;border-radius:12px;padding:13px;font-weight:900;cursor:pointer}.submit{background:#2563eb;color:#fff}.secondary{background:#eef5ff;color:#174ea6;margin-top:9px}.result{background:#fff;border:1px solid #e4e8ef;border-radius:18px;padding:18px;margin-top:15px}.score{font-size:42px;font-weight:950}.review{margin-top:14px}.review-card{border:1px solid #e4e8ef;border-radius:14px;padding:13px;margin:10px 0}.ok{border-left:4px solid #16a05a;background:#f1fbf5}.bad{border-left:4px solid #d14353;background:#fff4f5}.review-card p{line-height:1.6;margin:6px 0}@media(max-width:560px){.top{border-radius:18px}.q h3{font-size:16px}}</style></head><body><main class="wrap"><header class="top"><a class="back" href="index.html">← English Home</a><h1>📋 English Full Test</h1><p>30 questions • Grammar • Translation • Error Correction • Reading • Vocabulary</p></header><div class="bar"><span class="pill">30 MARKS</span><span class="pill">NO NEGATIVE MARKING</span><span class="pill" id="progress">0/30 answered</span></div><section id="test"></section><button class="submit" id="submit">Submit Test & Review ✓</button><section id="out"></section></main><script src="english-practice-bank.js"></script><script>const questions=ENGLISH_PRACTICE_BANK.slice(0,30);const test=document.getElementById('test');test.innerHTML=questions.map((q,i)=>`<article class="q"><h3>Q${i+1}. ${q.question}</h3>${q.options.map((o,j)=>`<label class="opt"><input type="radio" name="q${i}" value="${j}">${String.fromCharCode(65+j)}. ${o}</label>`).join('')}</article>`).join('');function updateProgress(){let n=0;questions.forEach((_,i)=>{if(document.querySelector(`input[name=q${i}]:checked`))n++});document.getElementById('progress').textContent=`${n}/${questions.length} answered`}test.addEventListener('change',updateProgress);document.getElementById('submit').onclick=()=>{let score=0;const details=questions.map((q,i)=>{const el=document.querySelector(`input[name=q${i}]:checked`);const chosen=el?Number(el.value):null;const ok=chosen===q.answer;if(ok)score++;return {q,chosen,ok}});const pct=Math.round(score/questions.length*100);try{localStorage.setItem('englishTestLast',JSON.stringify({score,total:questions.length,pct,time:Date.now()}))}catch(_){}document.getElementById('out').innerHTML=`<section class="result"><div class="score">${score}/${questions.length}</div><p><strong>${pct}%</strong> • ${pct>=90?'🏆 Outstanding!':pct>=75?'🌟 Very good!':pct>=60?'👍 Good attempt':'📚 Revise and try again'}</p><button class="secondary" onclick="document.getElementById('review').scrollIntoView({behavior:'smooth'})">🔎 See Complete Review</button><div class="review" id="review">${details.map((d,i)=>`<article class="review-card ${d.ok?'ok':'bad'}"><strong>Q${i+1} ${d.ok?'✅ Correct':'❌ Needs review'}</strong><p>${d.q.question}</p><p><b>Your answer:</b> ${d.chosen==null?'Not attempted':d.q.options[d.chosen]}</p><p><b>Correct answer:</b> ${d.q.options[d.q.answer]}</p><p><b>Why:</b> ${d.q.explanation||'This option follows the correct English rule or passage meaning.'}</p></article>`).join('')}</div></section>`;document.getElementById('submit').disabled=true;document.querySelectorAll('input').forEach(x=>x.disabled=true)};</script></body></html>
