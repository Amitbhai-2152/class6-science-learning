<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Daily Vocabulary • Class 6 English</title><link rel="stylesheet" href="../../css/site-mobile.css?v=1"><style>body{margin:0;background:#f7f9fc;color:#172033;font-family:system-ui,-apple-system,"Noto Sans Devanagari","Segoe UI",sans-serif}.wrap{max-width:760px;margin:auto;padding:18px 12px 55px}.top,.card{background:#fff;border:1px solid #e4e8ef;border-radius:20px;padding:20px;box-shadow:0 12px 30px rgba(20,35,70,.07)}.top{background:linear-gradient(135deg,#2563eb,#06b6d4);color:#fff}.back{color:#fff;text-decoration:none;font-weight:800}.pill{display:inline-block;margin-top:16px;padding:6px 9px;border-radius:999px;background:#ffffff20;font-size:11px;font-weight:900}.word{font-size:42px;font-weight:950;margin:12px 0 4px}.meaning{font-size:20px}.meta{color:#dff7ff}.source{margin-top:10px;font-size:11px;color:#e8fbff;font-weight:800}.card{margin-top:15px}.label{font-size:11px;font-weight:900;color:#2563eb}.example{margin-top:10px;padding:12px;background:#fff8df;border-left:4px solid #f59e0b;border-radius:10px;line-height:1.6}.challenge{margin-top:10px;padding:12px;background:#eef6ff;border-radius:10px;line-height:1.6}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.btn{border:0;border-radius:11px;padding:11px 14px;background:#2563eb;color:#fff;font-weight:900;cursor:pointer}.soft{background:#eef5ff;color:#1753a4}.counter{text-align:center;color:#667085;margin-top:12px;font-size:12px}.loading{text-align:center;padding:15px;color:#667085}.error{margin-top:10px;padding:10px;border-radius:10px;background:#fff3f5;color:#a53b4b;font-size:12px}@media(max-width:560px){.word{font-size:34px}.meaning{font-size:18px}.btn{flex:1}}
</style></head><body><main class="wrap"><header class="top"><a class="back" href="index.html">← English Home</a><div class="pill">DAILY VOCABULARY</div><div id="word" class="word">Loading…</div><div id="meaning" class="meaning"></div><div id="meta" class="meta"></div><div id="source" class="source"></div></header><section class="card"><div class="label">🌍 EXAMPLE</div><div id="example" class="example"></div><div class="label" style="margin-top:14px">🔁 SIMILAR / OPPOSITE</div><p id="syn"></p><div class="label">🎯 TODAY'S CHALLENGE</div><div id="challenge" class="challenge"></div><div class="actions"><button class="btn soft" id="prev">← Previous</button><button class="btn" id="hear">🔊 Hear word</button><button class="btn soft" id="next">Next →</button></div><div id="counter" class="counter"></div><div id="err"></div></section></main><script src="daily-vocabulary.js"></script><script src="../../js/ai-config.js?v=8"></script><script src="../../js/ai-tutor-client.js?v=8"></script><script>
'use strict';
const seedWords=Array.isArray(window.DAILY_VOCABULARY)?window.DAILY_VOCABULARY:[];
const CACHE_KEY='class6DailyVocabularyInfiniteV1';
const getCache=()=>{try{const x=JSON.parse(localStorage.getItem(CACHE_KEY)||'{}');return x&&typeof x==='object'?x:{}}catch(_){return {}}};
const putCache=x=>{try{localStorage.setItem(CACHE_KEY,JSON.stringify(x))}catch(_){} };
const getAll=()=>Object.values(getCache()).filter(x=>x&&x.word);
let index=Math.max(0,new Date().getDate()-1), words=[...seedWords], current=null;
const normalize=w=>({word:String(w.word||'New Word'),meaning:String(w.meaning||''),type:String(w.type||'word'),example:String(w.example||''),synonyms:String(w.synonyms||''),opposite:String(w.opposite||''),challenge:String(w.challenge||''),day:Number(w.day)||0,source:String(w.source||'AI generated')});
function setView(w,position){current=normalize(w);document.getElementById('word').textContent=current.word;document.getElementById('meaning').textContent=current.meaning;document.getElementById('meta').textContent=`${current.type} • Day ${current.day||position+1}`;document.getElementById('source').textContent=current.source==='Curated'?'⭐ Curated for Class 6':'✨ Fresh Class-6 word • saved for your future visits';document.getElementById('example').textContent=current.example;document.getElementById('syn').textContent=`Similar: ${current.synonyms||'—'}  •  Opposite: ${current.opposite||'—'}`;document.getElementById('challenge').textContent=current.challenge||`Make your own sentence with “${current.word}”.`;document.getElementById('counter').textContent=`Vocabulary ${position+1} • Practically endless`;document.getElementById('err').textContent='';}
function renderLoading(){document.getElementById('word').textContent='Generating…';document.getElementById('meaning').textContent='A fresh Class-6 word is being prepared';document.getElementById('meta').textContent='Please wait';document.getElementById('source').textContent='✨ AI vocabulary engine';document.getElementById('example').textContent='';document.getElementById('syn').textContent='';document.getElementById('challenge').textContent='';document.getElementById('counter').textContent='';}
async function generateFor(day){const cache=getCache();if(cache[day])return normalize(cache[day]);const previous=getAll().map(x=>x.word).concat(seedWords.map(x=>x.word));const prompt=`Create exactly ONE useful English vocabulary word for a Class 6 student. Avoid these already-used words: ${previous.join(', ')}. Return ONLY valid JSON with keys word, meaning, type, example, synonyms, opposite, challenge. Keep meaning in simple Hindi. Example must be simple Class-6 English. No markdown.`;const AI=window.AITutorClient;if(!AI)throw new Error('AI Tutor client load नहीं हुआ');const raw=await AI.ask({messages:[{role:'user',content:prompt}],subject:'English',chapter:'Daily Vocabulary',section:'Vocabulary'});const cleaned=String(raw).replace(/```json|```/gi,'').trim();const parsed=JSON.parse(cleaned);const out=normalize({...parsed,day,source:'AI generated'});cache[day]=out;putCache(cache);return out;}
async function ensure(day){if(day<seedWords.length)return normalize({...seedWords[day],source:'Curated'});const cached=getCache();if(cached[day])return normalize(cached[day]);renderLoading();try{return await generateFor(day)}catch(err){const fallback={word:'practice',meaning:'अभ्यास करना',type:'verb',example:'I practice English every day.',synonyms:'train, rehearse',opposite:'neglect',challenge:'Write one sentence using “practice”.',day,source:'Safe fallback'};document.getElementById('err').textContent='नया word अभी generate नहीं हो पाया; safe fallback दिखाया गया है।';return normalize(fallback)}}
async function show(day){index=Math.max(0,day);const w=await ensure(index);setView(w,index)}
document.getElementById('prev').onclick=()=>show(index-1<0?0:index-1);document.getElementById('next').onclick=()=>show(index+1);document.getElementById('hear').onclick=()=>{if(current&&'speechSynthesis'in window){speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(current.word))}};show(index);
</script></body></html>
