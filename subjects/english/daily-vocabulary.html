<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Daily Vocabulary • Class 6 English</title><style>body{margin:0;background:#f7f9fc;color:#172033;font-family:system-ui,-apple-system,"Noto Sans Devanagari","Segoe UI",sans-serif}.wrap{max-width:760px;margin:auto;padding:18px 12px 55px}.top,.card{background:#fff;border:1px solid #e4e8ef;border-radius:20px;padding:20px;box-shadow:0 12px 30px rgba(20,35,70,.07)}.top{background:linear-gradient(135deg,#2563eb,#06b6d4);color:#fff}.back{color:#fff;text-decoration:none;font-weight:800}.pill{display:inline-block;margin-top:16px;padding:6px 9px;border-radius:999px;background:#ffffff20;font-size:11px;font-weight:900}.word{font-size:42px;font-weight:950;margin:12px 0 4px}.meaning{font-size:20px}.meta{color:#dff7ff}.card{margin-top:15px}.label{font-size:11px;font-weight:900;color:#2563eb}.example{margin-top:10px;padding:12px;background:#fff8df;border-left:4px solid #f59e0b;border-radius:10px;line-height:1.6}.challenge{margin-top:10px;padding:12px;background:#eef6ff;border-radius:10px;line-height:1.6}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.btn{border:0;border-radius:11px;padding:11px 14px;background:#2563eb;color:#fff;font-weight:900;cursor:pointer}.soft{background:#eef5ff;color:#1753a4}.counter{text-align:center;color:#667085;margin-top:12px;font-size:12px}@media(max-width:560px){.word{font-size:34px}.meaning{font-size:18px}.btn{flex:1}} </style></head><body><main class="wrap"><header class="top"><a class="back" href="index.html">← English Home</a><div class="pill">DAILY VOCABULARY</div><div id="word" class="word">Word</div><div id="meaning" class="meaning"></div><div id="meta" class="meta"></div></header><section class="card"><div class="label">🌍 EXAMPLE</div><div id="example" class="example"></div><div class="label" style="margin-top:14px">🔁 SIMILAR / OPPOSITE</div><p id="syn"></p><div class="label">🎯 TODAY'S CHALLENGE</div><div id="challenge" class="challenge"></div><div class="actions"><button class="btn soft" id="prev">← Previous</button><button class="btn" id="hear">🔊 Hear word</button><button class="btn soft" id="next">Next →</button></div><div id="counter" class="counter"></div></section></main><script src="daily-vocabulary.js"></script><script>const words=DAILY_VOCABULARY;let index=Math.min(words.length-1,Math.max(0,(new Date().getDate()-1)%words.length));function render(){const w=words[index];document.getElementById('word').textContent=w.word;document.getElementById('meaning').textContent=w.meaning;document.getElementById('meta').textContent=`${w.type} • Day ${w.day}`;document.getElementById('example').textContent=w.example;document.getElementById('syn').textContent=`Similar: ${w.synonyms}  •  Opposite: ${w.opposite}`;document.getElementById('challenge').textContent=w.challenge;document.getElementById('counter').textContent=`Vocabulary ${index+1}/${words.length}`};document.getElementById('prev').onclick=()=>{index=(index-1+words.length)%words.length;render()};document.getElementById('next').onclick=()=>{index=(index+1)%words.length;render()};document.getElementById('hear').onclick=()=>{if('speechSynthesis' in window){speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(words[index].word))}};render();</script></body></html>
