<!doctype html>
<html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#20252b"><title>English Chapter • कक्षा 6</title><style>
:root{--bg:#f7f8fc;--card:#fff;--ink:#172033;--muted:#667085;--line:#e5e8ef;--p:#2563eb;--ok:#138a52;--bad:#c43d4b;--shadow:0 12px 32px rgba(20,35,70,.08)}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#eef5ff,transparent 34%),var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans Devanagari","Segoe UI",sans-serif}.top{background:linear-gradient(120deg,#20252b,#344054);color:#fff;padding:22px 16px 28px}.wrap,.main{max-width:1050px;margin:auto}.back{color:#e9edf2;text-decoration:none;font-weight:800}.pill{display:inline-block;margin-top:18px;padding:7px 10px;border-radius:999px;background:#ffffff16;font-size:11px;font-weight:900}.top h1{margin:8px 0 5px;font-size:clamp(29px,6vw,48px)}.top p{margin:0;color:#d5d9df;line-height:1.55}.main{padding:20px 16px 70px}.chapter-nav{display:flex;gap:8px;overflow:auto;padding-bottom:7px}.chapter-nav a{flex:none;text-decoration:none;color:#174ea6;background:#eef5ff;border:1px solid #cfe0ff;border-radius:999px;padding:8px 11px;font-size:11px;font-weight:900}.card{background:#fff;border:1px solid var(--line);border-radius:19px;padding:18px;box-shadow:var(--shadow)}.intro{margin-top:9px}.intro h2{margin:0 0 5px}.intro p{color:var(--muted);line-height:1.6}.flow{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:13px}.flow div{padding:11px;border:1px solid var(--line);border-radius:13px;background:#f8fbff}.flow b{display:block}.flow small{display:block;color:var(--muted);margin-top:3px;line-height:1.45}.sections{display:grid;gap:12px;margin-top:15px}.section-card h2{margin:5px 0 7px;font-size:20px}.section-card p{margin:0;line-height:1.75}.example{margin-top:9px;background:#fff8df;border-left:4px solid #f59e0b;padding:10px;border-radius:9px;line-height:1.6}.practice{margin-top:17px}.practice-grid{display:grid;gap:10px;margin-top:12px}.q{border:1px solid var(--line);border-radius:13px;padding:12px}.q b{display:block;line-height:1.5}.option{display:block;margin-top:7px;padding:9px;border:1px solid var(--line);border-radius:10px;cursor:pointer}.option input{margin-right:7px}.option.correct{border-color:#7bc99f;background:#effaf4}.option.wrong{border-color:#e2a0aa;background:#fff3f5}.check{margin-top:13px;padding:12px;border-radius:11px;background:#eef5ff;line-height:1.55}.submit{border:0;border-radius:11px;padding:12px 15px;background:var(--p);color:#fff;font-weight:900;cursor:pointer;margin-top:12px;width:100%}@media(max-width:800px){.flow{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.main{padding:16px 12px 55px}.card{padding:15px}.flow{grid-template-columns:1fr}.section-card h2{font-size:18px}}
</style></head><body><header class="top"><div class="wrap"><a class="back" href="index.html">← English Home</a><div class="pill" id="pill">CHAPTER</div><h1 id="title">English</h1><p id="summary">Grammar + Translation</p></div></header><main class="main"><nav class="chapter-nav" id="nav"></nav><section class="card intro"><h2>🧠 Learn → Example → Practice</h2><p id="intro"></p><div class="flow"><div><b>🧩 Concept</b><small>Rule को आसान भाषा में समझो</small></div><div><b>🌍 Example</b><small>Sentence में use देखो</small></div><div><b>✍️ Practice</b><small>खुद answer चुनो</small></div><div><b>🔎 Review</b><small>गलती हो तो सही rule देखो</small></div></div></section><section class="sections" id="sections"></section><section class="card practice"><h2>📝 Chapter Practice</h2><p id="practiceIntro" style="color:var(--muted)"></p><div class="practice-grid" id="practice"></div><button class="submit" id="submit">उत्तर जाँचें ✓</button><div id="result"></div></section></main><script src="english-content.js?v=4"></script><script src="english-architecture.js?v=1"></script><script src="english-expansion.js?v=4"></script><script src="english-expansion-loader.js?v=3"></script><script src="english-content-balance.js?v=2"></script><script>
const esc=s=>String(s??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[m]));
const chapters=EnglishApp.chapters(),n=Math.max(1,Math.min(chapters.length,Number(new URLSearchParams(location.search).get('chapter'))||1)),c=EnglishApp.getChapter(n);if(!c)location.href='index.html';
document.getElementById('nav').innerHTML=chapters.map(x=>`<a href="chapter.html?chapter=${x.id}">${x.id}. ${esc(x.title)}</a>`).join('');
document.getElementById('pill').textContent=`CHAPTER ${c.id}`;document.getElementById('title').textContent=c.title;document.getElementById('summary').textContent=c.summary;document.getElementById('intro').textContent=EnglishApp.chapterSummary(c);document.getElementById('practiceIntro').textContent=`${c.practice.length} practice questions • instant review • no negative marking`;
document.getElementById('sections').innerHTML=c.sections.map((s,i)=>`<article class="card section-card"><div style="font-size:11px;font-weight:900;color:#2563eb">LESSON ${i+1}/${c.sections.length}</div><h2>${esc(s[0])}</h2><p>${esc(s[1])}</p><div class="example"><b>🌍 Example:</b> ${esc(s[2])}</div></article>`).join('');
document.getElementById('practice').innerHTML=c.practice.map((q,i)=>`<article class="q" data-q="${i}"><b>Q${i+1}. ${esc(q[0])}</b>${q[1].map((o,j)=>`<label class="option"><input type="radio" name="q${i}" value="${j}">${String.fromCharCode(65+j)}. ${esc(o)}</label>`).join('')}</article>`).join('');
document.getElementById('submit').onclick=()=>{const answers=[...document.querySelectorAll('.q')].map(box=>{const p=box.querySelector('input:checked');return p?p.value:null}),r=EnglishApp.grade(c,answers);document.querySelectorAll('.q').forEach((box,i)=>{const ans=c.practice[i][2],chosen=answers[i];box.querySelectorAll('.option').forEach((lab,j)=>{lab.classList.remove('correct','wrong');if(j===ans)lab.classList.add('correct');if(chosen!==null&&Number(chosen)===j&&j!==ans)lab.classList.add('wrong')})});document.getElementById('result').innerHTML=`<div class="check"><b>${r.pct>=75?'✅ अच्छा काम!':'📚 दोबारा revise करो।'}</b><br>Score: <strong>${r.score}/${r.total}</strong> (${r.pct}%) • Answered: ${r.answered}/${r.total}<br>Green option = correct answer; red = your incorrect choice.</div>`;EnglishApp.emit('english:practice-complete',r)};
</script></body></html>
