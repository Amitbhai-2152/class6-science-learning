<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Error Correction Lab • कक्षा 6</title><style>body{margin:0;background:#f7f9fc;color:#172033;font-family:system-ui,-apple-system,"Noto Sans Devanagari","Segoe UI",sans-serif}.top{background:linear-gradient(120deg,#20252b,#344054);color:#fff;padding:22px 16px 28px}.wrap,.main{max-width:980px;margin:auto}.back{color:#fff;text-decoration:none;font-weight:800}.main{padding:18px 12px 60px}.hero,.card{background:#fff;border:1px solid #e4e8ef;border-radius:18px;padding:16px;box-shadow:0 10px 28px rgba(20,35,70,.06)}.hero{margin-bottom:12px}.stats{display:flex;gap:8px;flex-wrap:wrap}.stats span{padding:7px 9px;border-radius:999px;background:#eef5ff;color:#1753a4;font-size:11px;font-weight:900}.q{margin-top:12px}.qtext{font-size:18px;font-weight:850;line-height:1.55}.options{display:grid;gap:8px;margin-top:12px}.option{border:1px solid #e4e8ef;border-radius:11px;background:#fff;padding:11px 12px;text-align:left;font:inherit;cursor:pointer}.correct{background:#effaf4;border-color:#86efac}.wrong{background:#fff1f2;border-color:#fda4af}.rule{margin-top:10px;padding:11px 12px;border-radius:10px;background:#f8fbff;line-height:1.6;font-size:13px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.btn{border:0;border-radius:11px;padding:11px 14px;font-weight:900;cursor:pointer}.primary{background:#2563eb;color:#fff}.soft{background:#eef5ff;color:#1753a4;text-decoration:none}.result{text-align:center}.score{font-size:48px;font-weight:950}.review{display:grid;gap:9px;margin-top:14px}.item{border:1px solid #e4e8ef;border-radius:11px;padding:11px;text-align:left;line-height:1.55}.item.good{border-left:4px solid #16a34a}.item.bad{border-left:4px solid #dc2626}@media(max-width:560px){.main{padding:15px 11px 50px}.qtext{font-size:16px}.option{padding:10px}}
</style></head><body><header class="top"><div class="wrap"><a class="back" href="index.html">← English Home</a><h1>🛠️ Error Correction Lab</h1><p>गलत sentence पहचानो • सही करो • rule समझो • फिर दोबारा apply करो</p></div></header><main class="main"><section class="hero"><div class="stats"><span>20 Questions</span><span>Grammar Rules</span><span>Instant Explanation</span><span>No Negative Marking</span></div></section><div id="mount"></div></main><script src="error-correction-bank.js?v=1"></script><script>(function(){const root=document.getElementById('mount');const bank=[...ENGLISH_ERROR_BANK];let qs=bank.sort(()=>Math.random()-.5).slice(0,20),i=0,ans=[];function render(){const q=qs[i];root.innerHTML=`<section class="card q"><div style="font-size:11px;font-weight:900;color:#2563eb">QUESTION ${i+1}/${qs.length}</div><div class="qtext">${q.q}</div><div class="options">${q.o.map((x,j)=>`<button class="option" data-i="${j}">${String.fromCharCode(65+j)}. ${x}</button>`).join('')}</div><div id="rule"></div></section>`;root.querySelectorAll('.option').forEach(b=>b.onclick=()=>choose(+b.dataset.i))}function choose(n){if(ans[i]!=null)return;ans[i]=n;const q=qs[i];root.querySelectorAll('.option').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');if(j===n&&n!==q.a)b.classList.add('wrong')});const r=document.getElementById('rule');r.className='rule';r.innerHTML=`<b>${n===q.a?'✅ Correct':'❌ Not correct'}</b><br><b>Rule:</b> ${q.e}`;const a=document.createElement('div');a.className='actions';a.innerHTML=i===qs.length-1?'<button class="btn primary">Final Review →</button>':'<button class="btn primary">Next →</button>';r.appendChild(a);a.firstElementChild.onclick=()=>i===qs.length-1?finish(): (i++,render())}function finish(){const score=ans.reduce((s,x,j)=>s+(x===qs[j].a?1:0),0);root.innerHTML=`<section class="card result"><div class="score">${score}/${qs.length}</div><h2>${score/qs.length>=.8?'🏆 Grammar Star!':score/qs.length>=.6?'👍 Good Practice':'📚 Revise the rules'}</h2><p style="color:#667085">नीचे हर question का सही answer और grammar rule दिया गया है।</p><div class="review">${qs.map((q,j)=>`<article class="item ${ans[j]===q.a?'good':'bad'}"><b>Q${j+1}. ${q.q}</b><br>Your answer: ${ans[j]==null?'Skipped':q.o[ans[j]]}<br>Correct answer: <b>${q.o[q.a]}</b><br>💡 ${q.e}</article>`).join('')}</div><div class="actions"><button class="btn primary" onclick="location.reload()">🔄 New Test</button><a class="btn soft" href="index.html">← English Home</a></div></section>`}render()})();</script></body></html>
