<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Hindi Chapter • कक्षा 6</title><style>:root{--bg:#fffaf5;--card:#fff;--ink:#2a211b;--muted:#75675d;--line:#eadfd5;--p:#b45309;--ok:#15803d;--bad:#b91c1c;--shadow:0 12px 30px rgba(80,42,10,.08)}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#fff1df,transparent 32%),var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans Devanagari","Segoe UI",sans-serif}.top{background:linear-gradient(120deg,#7c2d12,#b45309);color:#fff;padding:22px 16px 28px}.wrap,.main{max-width:1050px;margin:auto}.back{color:#fff;text-decoration:none;font-weight:800}.pill{display:inline-block;margin-top:17px;padding:7px 10px;border-radius:999px;background:#ffffff20;font-size:11px;font-weight:900}.top h1{margin:8px 0 5px;font-size:clamp(29px,6vw,48px)}.top p{margin:0;color:#f7eadf;line-height:1.55}.main{padding:20px 16px 70px}.nav{display:flex;gap:8px;overflow:auto;padding-bottom:7px}.nav a{flex:none;text-decoration:none;color:#9a3412;background:#fff3e8;border:1px solid #f2d3bd;border-radius:999px;padding:8px 11px;font-size:11px;font-weight:900}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:17px;box-shadow:var(--shadow)}.intro{margin-top:9px}.intro h2{margin:0 0 5px}.intro p{color:var(--muted);line-height:1.7}.flow{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}.flow div{padding:10px;border:1px solid var(--line);border-radius:12px;background:#fffaf7}.flow b{display:block}.flow small{display:block;color:var(--muted);margin-top:3px;line-height:1.45}.lessons{display:grid;gap:12px;margin-top:14px}.lesson h2{margin:4px 0 7px;font-size:20px}.lesson p{margin:0;line-height:1.75}.example{margin-top:9px;padding:10px;background:#fff7e7;border-left:4px solid #f59e0b;border-radius:9px;line-height:1.65}.practice{margin-top:17px}.q{border:1px solid var(--line);border-radius:13px;padding:12px;margin-top:10px}.q b{display:block;line-height:1.55}.opt{display:block;margin-top:7px;padding:9px;border:1px solid var(--line);border-radius:10px}.opt input{margin-right:7px}.opt.correct{background:#effaf4;border-color:#86efac}.opt.wrong{background:#fff2f2;border-color:#fca5a5}.check{margin-top:12px;padding:12px;border-radius:11px;background:#fff3e8;line-height:1.6}.submit{width:100%;border:0;border-radius:11px;padding:12px;background:var(--p);color:#fff;font-weight:900;margin-top:12px;cursor:pointer}@media(max-width:800px){.flow{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.main{padding:16px 12px 55px}.flow{grid-template-columns:1fr}.lesson h2{font-size:18px}}</style></head><body><header class="top"><div class="wrap"><a class="back" href="index.html">← Hindi Home</a><div class="pill" id="pill">अध्याय</div><h1 id="title">हिंदी</h1><p id="summary">व्याकरण और भाषा</p></div></header><main class="main"><nav class="nav" id="nav"></nav><section class="card intro"><h2>🧠 समझो → उदाहरण → अभ्यास → सुधारो</h2><p id="intro"></p><div class="flow"><div><b>📘 नियम</b><small>अवधारणा आसान भाषा में</small></div><div><b>🌱 उदाहरण</b><small>वाक्य में प्रयोग देखो</small></div><div><b>✍️ अभ्यास</b><small>खुद उत्तर चुनो</small></div><div><b>🔎 समीक्षा</b><small>गलती का सही नियम देखो</small></div></div></section><section class="lessons" id="lessons"></section><section class="card practice"><h2>📝 अध्याय अभ्यास</h2><div id="practice"></div><button class="submit" id="submit">उत्तर जाँचें ✓</button><div id="result"></div></section></main><script src="hindi-content.js?v=2"></script><script src="hindi-content-expansion.js?v=2"></script><script>const chapters=HINDI_CHAPTERS,n=Math.max(1,Math.min(chapters.length,Number(new URLSearchParams(location.search).get('chapter'))||1)),c=chapters[n-1];document.getElementById('nav').innerHTML=chapters.map(x=>`<a href="chapter.html?chapter=${x.id}">${x.id}. ${x.title}</a>`).join('');document.getElementById('pill').textContent=`अध्याय ${c.id}`;document.getElementById('title').textContent=c.title;document.getElementById('summary').textContent=c.summary;document.getElementById('intro').textContent=`${c.lessons.length} learning lessons • examples • ${c.practice.length} practice questions`;document.getElementById('lessons').innerHTML=c.lessons.map((s,i)=>`<article class="card lesson"><div style="font-size:11px;font-weight:900;color:#b45309">पाठ ${i+1}/${c.lessons.length}</div><h2>${s[0]}</h2><p>${s[1]}</p><div class="example"><b>🌱 उदाहरण:</b> ${s[2]}</div></article>`).join('');document.getElementById('practice').innerHTML=c.practice.map((q,i)=>`<article class="q"><b>Q${i+1}. ${q[0]}</b>${q[1].map((o,j)=>`<label class="opt"><input type="radio" name="q${i}" value="${j}">${String.fromCharCode(65+j)}. ${o}</label>`).join('')}</article>`).join('');document.getElementById('submit').onclick=()=>{let score=0;document.querySelectorAll('.q').forEach((box,i)=>{const picked=box.querySelector(`input[name="q${i}"]:checked`),ans=c.practice[i][2];box.querySelectorAll('.opt').forEach((lab,j)=>{lab.classList.remove('correct','wrong');if(j===ans)lab.classList.add('correct');if(picked&&j===Number(picked.value)&&j!==ans)lab.classList.add('wrong')});if(picked&&Number(picked.value)===ans)score++});const pct=Math.round(score/c.practice.length*100);document.getElementById('result').innerHTML=`<div class="check"><b>${pct>=75?'✅ बहुत अच्छा!':'📚 थोड़ा और revise करो।'}</b><br>Score: <strong>${score}/${c.practice.length}</strong> (${pct}%)<br>हरा विकल्प सही उत्तर दिखाता है।</div>`};</script></body></html>
