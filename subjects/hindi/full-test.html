<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hindi Full Test • कक्षा 6</title><style>body{margin:0;background:#fffaf5;color:#2a211b;font-family:system-ui,-apple-system,"Noto Sans Devanagari","Segoe UI",sans-serif}.wrap{max-width:920px;margin:auto;padding:18px 12px 60px}.top,.q,.result{background:#fff;border:1px solid #eadfd5;border-radius:18px;padding:18px;margin:12px 0}.top{background:linear-gradient(135deg,#7c2d12,#dc2626);color:#fff}.back{color:#fff;text-decoration:none;font-weight:800}.pill{display:inline-block;padding:7px 10px;border-radius:999px;background:#fff3e8;color:#9a3412;font-size:11px;font-weight:900;margin-right:6px}.q h3{line-height:1.55}.opt{display:block;padding:10px;border:1px solid #eadfd5;border-radius:10px;margin:7px 0}.submit{width:100%;border:0;border-radius:12px;padding:13px;background:#b45309;color:#fff;font-weight:900;cursor:pointer}.ok{border-left:4px solid #16834f;background:#effaf4}.bad{border-left:4px solid #c43d4b;background:#fff3f4}</style></head><body><main class="wrap"><header class="top"><a class="back" href="index.html">← Hindi Home</a><h1>📋 Hindi Full Test</h1><p>30 प्रश्न • व्याकरण • शब्द-ज्ञान • पठन • लेखन</p></header><div><span class="pill">30 MARKS</span><span class="pill">NO NEGATIVE MARKING</span><span class="pill" id="progress">0/30 answered</span></div><section id="test"></section><button class="submit" id="submit">Submit Test & Review ✓</button><section id="out"></section></main><script src="hindi-content.js"></script><script>const qs=HINDI_PRACTICE_BANK.slice(0,30),root=document.getElementById('test');root.innerHTML=qs.map((q,i)=>`<article class="q"><h3>Q${i+1}. ${q.question}</h3>${q.options.map((o,j)=>`<label class="opt"><input type="radio" name="q${i}" value="${j}">${String.fromCharCode(65+j)}. ${o}</label>`).join('')}</article>`).join('');function prog(){let n=qs.reduce((s,_,i)=>s+(document.querySelector('input[name=q'+i+']:checked')?1:0),0);document.getElementById('progress').textContent=n+'/'+qs.length+' answered'}root.addEventListener('change',prog);document.getElementById('submit').onclick=()=>{let score=0;const review=qs.map((q,i)=>{const e=document.querySelector('input[name=q'+i+']:checked');const a=e?Number(e.value):null;const ok=a===q.answer;if(ok)score++;return `<article class="q ${ok?'ok':'bad'}"><b>Q${i+1} ${ok?'✅':'❌'}</b><p>${q.question}</p><p><b>Your:</b> ${a==null?'Not attempted':q.options[a]}</p><p><b>Correct:</b> ${q.options[q.answer]}</p><p>${q.explanation||'पाठ और व्याकरण के नियम के अनुसार यही सही उत्तर है।'}</p></article>`}).join('');const pct=Math.round(score/qs.length*100);try{localStorage.setItem('hindiTestLast',JSON.stringify({score,total:qs.length,pct,time:Date.now()}))}catch(_){}document.getElementById('out').innerHTML=`<section class="result"><h2>${score}/${qs.length} • ${pct}%</h2><p>${pct>=90?'🏆 शानदार!':pct>=75?'🌟 बहुत अच्छा!':pct>=60?'👍 अच्छा प्रयास':'📚 Revision करके फिर try करो।'}</p>${review}</section>`;document.getElementById('submit').disabled=true;document.querySelectorAll('input').forEach(x=>x.disabled=true)};</script></body></html>
