<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hindi Practice • कक्षा 6</title><style>body{font-family:system-ui;margin:0;background:#f7f8fc;color:#172033}.wrap{max-width:900px;margin:auto;padding:18px 12px 60px}.top,.q,.result{background:#fff;border:1px solid #e4e8ef;border-radius:18px;padding:18px;margin:12px 0}.top{background:linear-gradient(135deg,#b91c1c,#f97316);color:#fff}.opt{display:block;padding:10px;border:1px solid #e4e8ef;border-radius:10px;margin:7px 0}.submit{width:100%;padding:13px;border:0;border-radius:12px;background:#b91c1c;color:#fff;font-weight:900}h1{margin:8px 0}.muted{color:#667085;line-height:1.6}</style></head><body><main class="wrap"><header class="top"><a href="index.html" style="color:#fff">← Hindi Home</a><h1>📝 Hindi Practice</h1><p>व्याकरण • शब्द-ज्ञान • लेखन • अपठित गद्यांश</p></header><div id="test"></div><button class="submit" id="submit">उत्तर जाँचें ✓</button><div id="out"></div></main><script src="hindi-content.js"></script><script>const qs=HINDI_PRACTICE_BANK.slice(0,20),root=document.getElementById('test');root.innerHTML=qs.map((q,i)=>`<article class="q"><b>Q${i+1}. ${q.question}</b>${q.options.map((o,j)=>`<label class="opt"><input type="radio" name="q${i}" value="${j}">${String.fromCharCode(65+j)}. ${o}</label>`).join('')}</article>`).join('');document.getElementById('submit').onclick=()=>{let score=0;let html='';qs.forEach((q,i)=>{const e=document.querySelector(`input[name=q${i}]:checked`);const a=e?Number(e.value):null;const ok=a===q.answer;if(ok)score++;html+=`<div class="q"><b>Q${i+1} ${ok?'✅':'❌'}</b><p>${q.explanation||''}</p><p>सही उत्तर: ${q.options[q.answer]}</p></div>`});const pct=Math.round(score/qs.length*100);document.getElementById('out').innerHTML=`<section class="result"><h2>${score}/${qs.length} • ${pct}%</h2><p class="muted">${pct>=75?'बहुत अच्छा!':'दोबारा revise करो और फिर attempt करो।'}</p>${html}</section>`};</script></body></html>
