<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>English Revision • Class 6</title><link rel="stylesheet" href="css/style.css"><style>body{margin:0;background:#f4f7fb;color:#20252b;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.wrap{width:min(1100px,calc(100% - 24px));margin:auto;padding:14px 0 56px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.back{display:inline-flex;min-height:44px;align-items:center;padding:10px 15px;border-radius:12px;background:#e8edf3;color:#20252b;text-decoration:none;font-weight:800}.hero{margin-top:14px;padding:24px;border-radius:24px;background:linear-gradient(135deg,#20252b,#59636e);color:#fff}.hero h1{margin:0 0 8px;font-size:clamp(27px,5vw,42px)}.hero p{margin:0;line-height:1.7;color:#edf1f5}.tip{margin:14px 0;padding:12px 14px;background:#fff;border:1px solid #dfe5ec;border-radius:14px;line-height:1.55}.grid{display:grid;gap:12px}.chapter{background:#fff;border:1px solid #dfe5ec;border-radius:18px;overflow:hidden}.chapter summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:17px;min-height:60px}.chapter summary::-webkit-details-marker{display:none}.chapter summary span:first-child{display:grid;gap:4px}.chapter small{color:#667085;font-weight:800}.chapter strong{font-size:18px}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:0 12px 12px}.note{display:grid;grid-template-columns:auto 1fr;gap:10px;padding:14px;background:#fbfcfe;border:1px solid #e7ebf0;border-radius:14px}.num{width:28px;height:28px;border-radius:9px;background:#e9eef4;display:grid;place-items:center;font-weight:900;font-size:12px}.note b{display:block;margin-bottom:5px}.note p{margin:0;color:#56606d;font-size:13px;line-height:1.6}@media(max-width:700px){.cards{grid-template-columns:1fr}}</style></head><body><main class="wrap"><div class="top"><strong>📖 English Revision</strong><a class="back" href="revision-v2.html">← Subjects</a></div><section class="hero"><h1>📖 English — Smart Revision</h1><p>8 chapters • Each chapter has 8 direct study cards for rules, examples, common errors and exam use.</p></section><div class="tip">💡 Open one chapter at a time. Read the 8 cards, say the rule in your own words, then move to the next chapter.</div><section id="grid" class="grid"></section></main><script>const D=[['Parts of Speech','Words have different grammatical jobs such as noun, pronoun, verb, adjective, adverb, preposition and conjunction.'],['Nouns & Pronouns','Nouns name people, places, animals, things or ideas. Pronouns replace nouns to avoid repetition and should agree with them.'],['Verbs & Tenses','A verb shows action or state. Tense tells when an action happens, so the verb form should match the time and subject.'],['Adjectives & Adverbs','Adjectives describe nouns or pronouns. Adverbs commonly describe verbs, adjectives or other adverbs and add detail.'],['Articles & Prepositions','A, an and the introduce nouns with different levels of specificity. Prepositions show relationships of place, time or direction.'],['Subject–Verb Agreement','The verb form should match the subject in number and person. Singular subjects usually take singular present-tense forms.'],['Sentence & Error Correction','Clear sentences need correct word order, punctuation, capitalization and grammar. Check one rule at a time while correcting errors.'],['Translation & Everyday English','Good translation keeps the meaning natural instead of replacing every word mechanically. Common sentence patterns help in daily English.']];const L=['Core idea','Key rule','How to use it','Simple example','Common confusion','Exam focus','Memory hook','One-line recap'];const mk=(t,c)=>{const x=[c,`Key terms and rule: ${t}. Identify the grammatical job or relationship before choosing an answer.`,`Use ${t} by first finding the word/sentence that carries the rule, then apply the rule to the whole sentence.`,`Example: make one short sentence using ${t} and underline the word or pattern that shows the rule.`,`Common trap: do not choose a form just because it “sounds right”; check the subject, time, or grammatical role.`,`Exam focus: state the rule briefly and then give the corrected or suitable example.`,`Memory hook: ${t} = rule + example + correct use.`,`Recap: ${t} becomes easy when the rule is recognized before the sentence is completed.`];return x.map((v,i)=>`<div class="note"><span class="num">${i+1}</span><div><b>${L[i]}</b><p>${v}</p></div></div>`).join('')};document.getElementById('grid').innerHTML=D.map((d,i)=>`<details class="chapter"><summary><span><small>Chapter ${i+1}</small><strong>${d[0]}</strong></span><span>＋</span></summary><div class="cards">${mk(d[0],d[1])}</div></details>`).join('')</script></body></html>
