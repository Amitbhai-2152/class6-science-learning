<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#20252b"><title>Revision • कक्षा 6</title><link rel="stylesheet" href="css/style.css"><style>
:root{--ink:#20252b;--muted:#667085;--line:#e1e6ec;--soft:#f4f6f8}*{box-sizing:border-box}body{margin:0;background:#f6f7f9;color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.rv-wrap{width:min(1180px,calc(100% - 32px));margin:0 auto;padding:18px 0 48px}.rv-top{display:flex;gap:12px;align-items:center;justify-content:space-between;margin-bottom:16px}.rv-brand{font-weight:900;font-size:18px}.rv-back,.rv-btn{border:0;border-radius:12px;min-height:44px;padding:11px 16px;font:inherit;font-weight:800;cursor:pointer}.rv-back{background:#e9edf1;color:var(--ink)}.rv-btn{background:var(--ink);color:#fff}.rv-hero{padding:26px;border-radius:24px;background:linear-gradient(135deg,#20252b,#59636e);color:#fff;box-shadow:0 14px 32px rgba(20,30,50,.12)}.rv-hero h1{margin:0 0 8px;font-size:clamp(28px,5vw,42px);line-height:1.2}.rv-hero p{margin:0;color:#e8edf2;line-height:1.7;max-width:760px}.rv-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:18px}.rv-stat{padding:13px;border:1px solid #ffffff24;border-radius:15px;background:#ffffff10}.rv-stat b{display:block;font-size:22px}.rv-stat span{font-size:11px;color:#d9e0e7}.rv-section{margin-top:18px}.rv-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.rv-sub{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:0 8px 22px rgba(20,30,50,.06);cursor:pointer;transition:transform .18s ease,box-shadow .18s ease}.rv-sub:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(20,30,50,.1)}.rv-sub:focus-within{outline:3px solid #20252b22;outline-offset:2px}.rv-icon{font-size:34px}.rv-sub h2{font-size:20px;margin:8px 0}.rv-muted{color:var(--muted);font-size:13px;line-height:1.6}.rv-search{width:100%;margin:16px 0 0;border:1px solid var(--line);border-radius:14px;padding:13px 15px;font:inherit;background:#fff;outline:none}.rv-search:focus{border-color:#20252b;box-shadow:0 0 0 3px #20252b18}.rv-chapters{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.rv-ch{display:flex;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:17px;padding:14px}.rv-ch-main{flex:1;min-width:0}.rv-ch-main b{display:block;line-height:1.45}.rv-ch-main small{display:block;margin-top:5px;color:var(--muted);line-height:1.5}.rv-chip{display:inline-flex;align-items:center;padding:4px 8px;border-radius:99px;background:var(--soft);color:var(--muted);font-size:11px;font-weight:800;margin-top:7px}.rv-deck{width:min(780px,100%);margin:0 auto}.rv-card{height:390px;perspective:1100px}.rv-face{height:100%;position:relative;transform-style:preserve-3d;transition:transform .45s;cursor:pointer}.rv-face.flip{transform:rotateY(180deg)}.rv-side{position:absolute;inset:0;backface-visibility:hidden;background:#fff;border:1px solid var(--line);border-radius:24px;padding:28px;display:flex;flex-direction:column;justify-content:center;box-shadow:0 16px 35px rgba(20,30,50,.1)}.rv-side.back{transform:rotateY(180deg);background:#f9fafb}.rv-kicker{font-size:11px;font-weight:900;color:#667085;letter-spacing:.04em}.rv-side h2{font-size:clamp(24px,4vw,34px);line-height:1.3;margin:10px 0 12px}.rv-side p{font-size:17px;line-height:1.8;margin:0}.rv-tip{margin-top:18px;padding:12px 14px;border-radius:12px;background:#f0f3f6;color:#46505b;line-height:1.6;font-size:13px}.rv-controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}.rv-progress{height:8px;background:#e8edf2;border-radius:99px;overflow:hidden;margin-top:16px}.rv-progress i{display:block;height:100%;background:#fff}.rv-empty{padding:24px;background:#fff;border:1px solid var(--line);border-radius:18px;color:var(--muted)}@media(max-width:900px){.rv-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:620px){.rv-wrap{width:calc(100% - 20px);padding-top:12px}.rv-top{align-items:flex-start}.rv-stats,.rv-grid,.rv-chapters{grid-template-columns:1fr}.rv-hero{padding:19px}.rv-card{height:340px
