name: Progress Engine Runtime Check

on:
  push:
    paths:
      - 'js/xp-system.js'
      - 'js/home-streak-v2.js'
      - 'js/progress.js'
      - 'js/xp-unify-bridge-v2.js'
      - 'js/home-streak-cloud-sync.js'
      - 'js/xp-cloud-sync.js'
      - 'js/subject-progress-cloud-sync.js'
      - 'subjects/gk/**'
      - 'subjects/english/**'
      - 'subjects/hindi/**'
      - 'subjects/social-science/**'
      - 'subjects/maths/**'
      - 'scripts/check-progress-engine-runtime.mjs'
      - 'scripts/check-progress-state-migration.mjs'
      - 'scripts/check-subject-progress-wiring.mjs'
      - 'scripts/check-production-audit.mjs'
      - 'scripts/check-production-cleanup.mjs'
      - 'scripts/check-browser-compatibility.mjs'
      - 'package.json'
      - '.github/workflows/progress-engine-runtime.yml'
  pull_request:
    paths:
      - 'js/xp-system.js'
      - 'js/home-streak-v2.js'
      - 'js/progress.js'
      - 'js/xp-unify-bridge-v2.js'
      - 'js/home-streak-cloud-sync.js'
      - 'js/xp-cloud-sync.js'
      - 'js/subject-progress-cloud-sync.js'
      - 'subjects/gk/**'
      - 'subjects/english/**'
      - 'subjects/hindi/**'
      - 'subjects/social-science/**'
      - 'subjects/maths/**'
      - 'scripts/check-progress-engine-runtime.mjs'
      - 'scripts/check-progress-state-migration.mjs'
      - 'scripts/check-subject-progress-wiring.mjs'
      - 'scripts/check-production-audit.mjs'
      - 'scripts/check-production-cleanup.mjs'
      - 'scripts/check-browser-compatibility.mjs'
      - 'package.json'
      - '.github/workflows/progress-engine-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Asia/Kolkata
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Validate progress engine JavaScript syntax
        run: node --check js/xp-system.js && node --check js/home-streak-v2.js && node --check js/progress.js && node --check js/xp-unify-bridge-v2.js && node --check js/home-streak-cloud-sync.js && node --check js/xp-cloud-sync.js && node --check js/subject-progress-cloud-sync.js && node --check scripts/check-progress-engine-runtime.mjs && node --check scripts/check-progress-state-migration.mjs && node --check scripts/check-subject-progress-wiring.mjs && node --check scripts/check-production-audit.mjs && node --check scripts/check-production-cleanup.mjs && node --check scripts/check-browser-compatibility.mjs && node --check subjects/gk/gk-progress-hi.js && node --check subjects/gk/hi-progress-engine.js && node --check subjects/english/english-progress.js && node --check subjects/hindi/hindi-progress.js && node --check subjects/social-science/social-science-progress.js && node --check subjects/maths/maths-exam.js
      - name: Run progress engine runtime regression check
        run: npm run check:progress-engine-runtime
      - name: Run progress state migration check
        run: npm run check:progress-state-migration
      - name: Run subject progress wiring audit
        run: npm run check:subject-progress-wiring
      - name: Run browser compatibility smoke check
        run: npm run check:browser-compatibility
      - name: Run final production audit
        run: npm run check:production-audit
      - name: Run production cleanup audit
        run: npm run check:production-cleanup
