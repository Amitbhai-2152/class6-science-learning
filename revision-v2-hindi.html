<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>हिंदी Revision • Class 6</title><link rel="stylesheet" href="css/style.css"><style>body{margin:0;background:#f4f7fb;color:#20252b;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.wrap{width:min(1100px,calc(100% - 24px));margin:auto;padding:14px 0 56px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.back{display:inline-flex;min-height:44px;align-items:center;padding:10px 15px;border-radius:12px;background:#e8edf3;color:#20252b;text-decoration:none;font-weight:800}.hero{margin-top:14px;padding:24px;border-radius:24px;background:linear-gradient(135deg,#20252b,#59636e);color:#fff}.hero h1{margin:0 0 8px;font-size:clamp(27px,5vw,42px)}.hero p{margin:0;line-height:1.7;color:#edf1f5}.tip{margin:14px 0;padding:12px 14px;background:#fff;border:1px solid #dfe5ec;border-radius:14px;line-height:1.55}.grid{display:grid;gap:12px}.chapter{background:#fff;border:1px solid #dfe5ec;border-radius:18px;overflow:hidden}.chapter summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:17px;min-height:60px}.chapter summary::-webkit-details-marker{display:none}.chapter summary span:first-child{display:grid;gap:4px}.chapter small{color:#667085;font-weight:800}.chapter strong{font-size:18px}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:0 12px 12px}.note{display:grid;grid-template-columns:auto 1fr;gap:10px;padding:14px;background:#fbfcfe;border:1px solid #e7ebf0;border-radius:14px}.num{width:28px;height:28px;border-radius:9px;background:#e9eef4;display:grid;place-items:center;font-weight:900;font-size:12px}.note b{display:block;margin-bottom:5px}.note p{margin:0;color:#56606d;font-size:13px;line-height:1.6}@media(max-width:700px){.cards{grid-template-columns:1fr}}</style></head><body><main class="wrap"><div class="top"><strong>🪔 हिंदी Revision</strong><a class="back" href="revision-v2.html">← Subjects</a></div><section class="hero"><h1>🪔 हिंदी — Smart Revision</h1><p>8 chapters • हर chapter में नियम, उदाहरण, सामान्य भूल और परीक्षा उपयोग सहित 8 study cards.</p></section><div class="tip">💡 एक chapter खोलकर 8 cards पढ़ो। फिर नियम को अपनी भाषा में बोलकर दोहराओ और अगला chapter खोलो।</div><section id="grid" class="grid"></section></main><script>const D=[['संज्ञा','संज्ञा किसी व्यक्ति, वस्तु, स्थान, प्राणी या भाव के नाम को बताती है। इसके भेद पहचानना भाषा की नींव है।'],['सर्वनाम','सर्वनाम संज्ञा के स्थान पर प्रयुक्त होता है, जैसे मैं, तुम, वह और यह। इससे भाषा में दोहराव कम होता है।'],['विशेषण','विशेषण संज्ञा या सर्वनाम की विशेषता, संख्या या मात्रा बताता है और वाक्य का अर्थ स्पष्ट करता है।'],['क्रिया','क्रिया कार्य, घटना या अवस्था का बोध कराती है। वाक्य में कर्ता और क्रिया का संबंध समझना जरूरी है।'],['काल','काल से क्रिया के समय का पता चलता है—वर्तमान, भूत और भविष्य। प्रसंग के अनुसार क्रिया-रूप बदलता है।'],['वचन और लिंग','वचन से एक या अनेक का बोध और लिंग से पुल्लिंग या स्त्रीलिंग का बोध होता है। संबंधित शब्दों का रूप सही रखना चाहिए।'],['वाक्य शुद्धि','वाक्य शुद्धि में वर्तनी, लिंग-वचन, क्रिया, शब्द-क्रम और विराम चिह्न की गलतियाँ सुधारी जाती हैं।'],['अनुच्छेद लेखन','अच्छे अनुच्छेद में स्पष्ट विषय, क्रमबद्ध विचार, सरल भाषा और उचित निष्कर्ष होता है। विषय से भटकना उत्तर कमजोर करता है।']];const L=['मुख्य विचार','जरूरी नियम','कैसे समझें','सरल उदाहरण','आम भ्रम','परीक्षा में','याद रखने की तरकीब','एक लाइन में recap'];const mk=(t,c)=>{const x=[c,`जरूरी नियम: ${t} की परिभाषा और उसके मुख्य भेद/रूप पहले पहचानें, फिर उदाहरण पर लागू करें।`,`समझने का तरीका: वाक्य पढ़कर देखें कि ${t} का कौन-सा काम हो रहा है और वह दूसरे शब्दों से कैसे जुड़ा है।`,`सरल उदाहरण: “${t}” का उपयोग दिखाने वाला एक छोटा वाक्य बनाइए और संबंधित शब्द को पहचानिए।`,`आम भूल: केवल शब्द देखकर उत्तर न चुनें; पूरे वाक्य का अर्थ, लिंग, वचन, काल और शब्द-सम्बन्ध भी जाँचें।`,`परीक्षा में: परिभाषा + एक सही उदाहरण + आवश्यक भेद लिखने से उत्तर मजबूत होता है।`,`याद रखने की तरकीब: ${t} = परिभाषा + उदाहरण + सही प्रयोग।`,`Recap: ${t} को समझो, उदाहरण से पहचानो और फिर अपने वाक्य में प्रयोग करो।`];return x.map((v,i)=>`<div class="note"><span class="num">${i+1}</span><div><b>${L[i]}</b><p>${v}</p></div></div>`).join('')};document.getElementById('grid').innerHTML=D.map((d,i)=>`<details class="chapter"><summary><span><small>Chapter ${i+1}</small><strong>${d[0]}</strong></span><span>＋</span></summary><div class="cards">${mk(d[0],d[1])}</div></details>`).join('')</script></body></html>
