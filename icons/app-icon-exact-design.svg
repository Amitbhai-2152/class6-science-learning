</g>

<!-- large 6 -->
<text x="256" y="299" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="170" font-weight="900" fill="#fff" filter="url(#shadow)">6</text>

<!-- open book -->
<g transform="translate(256 339)" filter="url(#shadow)">
 <path d="M-183 20Q-88-9 0 24v104Q-93 93-183 124z" fill="url(#page)" stroke="#70cfff" stroke-width="4"/>
