 <circle r="8" fill="#ffb51d" stroke="none"/>
</g>

<!-- light bulb -->
<g transform="translate(254 83)" filter="url(#shadow)">
 <path d="M-18 6c0-26 17-42 38-42s38 16 38 42c0 13-6 23-14 33-6 7-8 12-8 18H-7c0-6-2-11-8-18C-12 29-18 19-18 6z" fill="url(#gold)"/>
