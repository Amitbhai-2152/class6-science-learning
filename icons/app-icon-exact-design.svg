<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Class 6 Learning Hub">
<defs>
 <linearGradient id="border" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1689ff"/><stop offset=".5" stop-color="#18d9d6"/><stop offset="1" stop-color="#4939ff"/></linearGradient>
 <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#168eff"/><stop offset="1" stop-color="#0755d6"/></linearGradient>
 <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff7a0"/><stop offset=".55" stop-color="#ffd23c"/><stop offset="1" stop-color="#ff9b12"/></linearGradient>
 <linearGradient id="page" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#dff3ff"/></linearGradient>
 <filter id="shadow" x="-40%" y="-40%" width="180%" height="200%"><feDropShadow dx="0" dy="7" stdDeviation="6" flood-opacity=".28"/></filter>
</defs>
<rect x="4" y="4" width="504" height="504" rx="124" fill="url(#border)"/>
<rect x="18" y="18" width="476" height="476" rx="110" fill="#fff"/>
<path d="M112 173h288v176H112z" fill="url(#blue)" opacity=".98"/>
<circle cx="256" cy="260" r="127" fill="#0d72ed" opacity=".92"/>

