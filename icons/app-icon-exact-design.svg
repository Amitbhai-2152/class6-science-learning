<line x1="122" y1="457" x2="184" y2="457" stroke="#1591ff" stroke-width="4" stroke-linecap="round"/><line x1="328" y1="457" x2="390" y2="457" stroke="#1591ff" stroke-width="4" stroke-linecap="round"/>
<text x="256" y="461" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="800" letter-spacing="4" fill="#12326d">LEARNING HUB</text>
