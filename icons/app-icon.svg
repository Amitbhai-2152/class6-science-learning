<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Class 6 Learning Hub">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#071a3d"/>
    <stop offset="0.55" stop-color="#0a3b82"/>
    <stop offset="1" stop-color="#07152f"/>
  </linearGradient>
  <linearGradient id="book" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffffff"/>
    <stop offset="1" stop-color="#d8efff"/>
  </linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="0.8" y2="1">
    <stop offset="0" stop-color="#fff58a"/>
    <stop offset="0.55" stop-color="#ffd43b"/>
    <stop offset="1" stop-color="#ff9f0a"/>
  </linearGradient>
  <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#83f7ff"/>
    <stop offset="1" stop-color="#3a9cff"/>
  </linearGradient>
  <filter id="glowBlue" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="7" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="glowGold" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-opacity=".35"/></filter>
</defs>
<rect x="8" y="8" width="496" height="496" rx="116" fill="url(#bg)"/>
<rect x="14" y="14" width="484" height="484" rx="110" fill="none" stroke="#1f8fff" stroke-width="6" opacity=".85"/>
<circle cx="256" cy="245" r="178" fill="#0b5fd7" opacity=".09"/>

<!-- learning sparkles -->
<g fill="#fff" opacity=".95" filter="url(#glowBlue)">
  <path d="M84 182l5 12 12 5-12 5-5 12-5-12-12-5 12-5z"/>
  <path d="M421 178l4 10 10 4-10 4-4 10-4-10-10-4 10-4z"/>
  <path d="M98 302l4 10 10 4-10 4-4 10-4-10-10-4 10-4z"/>
</g>

<!-- atom -->
<g transform="translate(84 102)" fill="none" stroke="#7ee7ff" stroke-width="7" opacity=".95" filter="url(#glowBlue)">
  <ellipse cx="0" cy="0" rx="44" ry="18" transform="rotate(25)"/>
  <ellipse cx="0" cy="0" rx="44" ry="18" transform="rotate(-25)"/>
  <ellipse cx="0" cy="0" rx="44" ry="18"/>
  <circle cx="0" cy="0" r="8" fill="#54ddff" stroke="none"/>
</g>

<!-- calculator -->
<g transform="translate(385 94) rotate(12)" filter="url(#shadow)">
  <rect x="-31" y="-43" width="62" height="86" rx="13" fill="#38bdf8" stroke="#b8f6ff" stroke-width="4"/>
  <rect x="-18" y="-30" width="36" height="17" rx="4" fill="#082957"/>
  <g fill="#08326a">
    <rect x="-19" y="-4" width="12" height="10" rx="2"/><rect x="-2" y="-4" width="12" height="10" rx="2"/><rect x="15" y="-4" width="12" height="10" rx="2"/>
    <rect x="-19" y="12" width="12" height="10" rx="2"/><rect x="-2" y="12" width="12" height="10" rx="2"/><rect x="15" y="12" width="12" height="10" rx="2"/>
  </g>
</g>

<!-- central open book -->
<g transform="translate(256 330)" filter="url(#shadow)">
  <path d="M-168 35Q-92-2 0 29v99Q-88 94-168 118z" fill="url(#book)" stroke="#68cfff" stroke-width="4"/>
  <path d="M168 35Q92-2 0 29v99q88-34 168-10z" fill="url(#book)" stroke="#68cfff" stroke-width="4"/>
  <path d="M-168 118Q-88 91 0 128q88-37 168-10" fill="none" stroke="#2296ff" stroke-width="9" stroke-linecap="round"/>
  <path d="M-152 47q70-29 136-3M-150 69q70-27 132-3M152 47q-70-29-136-3M150 69q-70-27-132-3" fill="none" stroke="#9fdcff" stroke-width="5" stroke-linecap="round" opacity=".85"/>
</g>

<!-- golden 6 -->
<g filter="url(#glowGold)">
  <path d="M282 147c-19-21-50-32-82-31-49 2-81 32-81 79 0 45 33 76 83 76 28 0 53-8 70-27 17-18 25-44 25-70 0-9-2-18-5-27l-38 18c1 4 2 8 2 12 0 21-14 36-39 36-23 0-38-13-38-34 0-21 15-35 39-35 17 0 31 6 45 18z" fill="url(#gold)" stroke="#fff6ae" stroke-width="5" stroke-linejoin="round"/>
  <circle cx="242" cy="241" r="18" fill="#07357a"/>
</g>

<!-- lightbulb -->
<g transform="translate(256 74)" filter="url(#glowGold)">
  <path d="M-19 8c0-27 17-44 39-44s39 17 39 44c0 14-6 24-15 35-6 7-8 12-8 20H3c0-8-2-13-8-20C-13 32-19 22-19 8z" fill="url(#gold)" stroke="#fff5a0" stroke-width="4"/>
  <path d="M11 64h18M10 74h20" stroke="#7ee7ff" stroke-width="7" stroke-linecap="round"/>
  <path d="M4 8l14 14L33 5" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
</g>

<!-- small book -->
<g transform="translate(422 286) rotate(-10)" filter="url(#shadow)">
  <path d="M-28-20Q-10-29 0-21v43Q-12 15-28 20z" fill="#ff7f95" stroke="#ffc0cb" stroke-width="3"/>
  <path d="M28-20Q10-29 0-21v43Q12 15 28 20z" fill="#ff5f7c" stroke="#ffc0cb" stroke-width="3"/>
  <path d="M-20-13Q-10-18-4-14M20-13Q10-18 4-14" fill="none" stroke="#fff" stroke-width="3" opacity=".8"/>
</g>

<!-- leaf -->
<g transform="translate(93 295) rotate(-12)" filter="url(#shadow)">
  <path d="M0 35C-24 7-18-31 18-43 34-23 28 12 0 35z" fill="#67df65" stroke="#a7ff9b" stroke-width="4"/>
  <path d="M2 29L17-29" stroke="#1f8a3b" stroke-width="4" stroke-linecap="round"/>
</g>

<!-- app name -->
<text x="256" y="445" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="900" fill="#ffffff">CLASS 6</text>
<text x="256" y="477" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="5" fill="#8fe8ff">LEARNING HUB</text>
</svg>
